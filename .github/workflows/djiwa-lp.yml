name: DJIWA LP - DexScreener Live Paper LP

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: djiwa-lp-paper-simulation
  cancel-in-progress: false

jobs:
  live-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run live scan and virtual LP simulation
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python main.py

      - name: Save paper state to repository
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/paper_state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update DJIWA LP paper simulation state"
            git push origin HEAD:main
          else
            echo "No paper-state changes to commit."
          fi

      - name: Upload scan and simulation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: djiwa-lp-live-paper-report
          path: reports/
          if-no-files-found: warn
          retention-days: 30
