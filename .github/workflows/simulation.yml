
name: DJIWA LP Simulation

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

jobs:
  paper-trading:
    name: Run DJIWA Paper Trading
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run simulation
        env:
          SIMULATION_CASH: "1000"
        run: python main.py

      - name: Upload simulation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: djiwa-lp-simulation-reports
          path: reports/
          if-no-files-found: warn
          retention-days: 30
