name: Karyawan Digital LP Automation

on:
  # Jadwal otomatis: Berjalan setiap 6 jam sekali (bisa diubah sesuai kebutuhan)
  schedule:
    - cron: '0 */6 * * *'
  
  # Tombol manual: Memungkinkan Anda menjalankan simulasi kapan saja lewat web GitHub
  workflow_dispatch:

jobs:
  run-lp-agent:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests google-generativeai

    - name: Run Digital Employee Script
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        python main.py
