<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DJIWA LABS - Isometric Office</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap');
        
        * {
            box-sizing: border-box;
            user-select: none;
        }

        body { 
            margin: 0; 
            padding: 0; 
            background: #0f0a1c; 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            overflow: hidden; 
            color: white; 
            height: 100vh;
        }
        
        /* Glassmorphism Dashboard Header */
        .dashboard { 
            width: 90%; 
            max-width: 900px; 
            background: rgba(25, 16, 44, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 14px; 
            padding: 10px 24px; 
            margin-top: 15px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.6); 
            border: 1px solid rgba(167, 139, 250, 0.25); 
            z-index: 10; 
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background-color: #3fb950;
            border-radius: 50%;
            box-shadow: 0 0 8px #3fb950;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(63, 185, 80, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(63, 185, 80, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(63, 185, 80, 0); }
        }

        .dashboard h2 { 
            margin: 0; 
            font-size: 18px; 
            font-weight: 800;
            color: #d8b4fe;
            letter-spacing: 1px;
        }

        .stats { 
            display: flex; 
            gap: 20px; 
        }

        .stat {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .stat span { 
            font-size: 10px; 
            color: #a78bfa; 
            font-weight: 700;
            text-transform: uppercase;
        }

        .stat strong { 
            font-size: 15px; 
            color: #4ade80; 
            font-weight: 700;
        }

        .badge {
            background: rgba(74, 222, 128, 0.15);
            padding: 2px 8px;
            border-radius: 6px;
            border: 1px solid rgba(74, 222, 128, 0.3);
        }

        canvas { 
            display: block; 
            cursor: pointer;
        }

        .instructions {
            position: absolute;
            bottom: 12px;
            font-size: 12px;
            color: #d8b4fe;
            background: rgba(25, 16, 44, 0.85);
            padding: 6px 16px;
            border-radius: 20px;
            border: 1px solid rgba(167, 139, 250, 0.3);
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="dashboard">
        <div class="brand">
            <div class="status-dot"></div>
            <h2>DJIWA LABS HQ</h2>
        </div>
        <div class="stats">
            <div class="stat"><span>PnL Total</span><strong class="badge">+$18,374.56</strong></div>
            <div class="stat"><span>Posisi Aktif</span><strong>5 / 5</strong></div>
            <div class="stat"><span>Saldo Web3</span><strong style="color:#c084fc;">20.00 SOL</strong></div>
        </div>
    </div>

    <canvas id="officeCanvas"></canvas>
    <div class="instructions">💡 Klik karakter robot untuk mengganti pesan mereka</div>

    <script>
        const canvas = document.getElementById('officeCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight - 60;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // --- RUMUS ISOMETRIC PRESISI (2:1 Standard Isometric Projection) ---
        const TILE_W = 70; // Lebar ubin
        const TILE_H = 35; // Tinggi ubin (rasio 2:1 standar isometric)

        function gridToScreen(gx, gy, gz = 0, originX, originY) {
            const sx = originX + (gx - gy) * (TILE_W / 2);
            const sy = originY + (gx + gy) * (TILE_H / 2) - gz;
            return { x: sx, y: sy };
        }

        // --- GAMBAR UBIN LANTAI ISOMETRIC ---
        function drawTile(gx, gy, colorTop, colorBorder, originX, originY) {
            const p0 = gridToScreen(gx, gy, 0, originX, originY);
            const p1 = gridToScreen(gx + 1, gy, 0, originX, originY);
            const p2 = gridToScreen(gx + 1, gy + 1, 0, originX, originY);
            const p3 = gridToScreen(gx, gy + 1, 0, originX, originY);

            ctx.beginPath();
            ctx.moveTo(p0.x, p0.y);
            ctx.lineTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.lineTo(p3.x, p3.y);
            ctx.closePath();
            
            ctx.fillStyle = colorTop;
            ctx.fill();
            ctx.strokeStyle = colorBorder;
            ctx.lineWidth = 1;
            ctx.stroke();
        }

        // --- GAMBAR MEJA KANTOR + MONITOR + LAPTOP ---
        function drawDesk(gx, gy, label, originX, originY, isHovered) {
            // Posisi Meja di Grid
            const deskW = 0.8;
            const deskH = 0.8;
            const deskZ = 24; // Tinggi Meja

            // Sudut-sudut Atas Meja
            const t0 = gridToScreen(gx, gy, deskZ, originX, originY);
            const t1 = gridToScreen(gx + deskW, gy, deskZ, originX, originY);
            const t2 = gridToScreen(gx + deskW, gy + deskH, deskZ, originX, originY);
            const t3 = gridToScreen(gx, gy + deskH, deskZ, originX, originY);

            // Sudut-sudut Bawah Meja
            const b0 = gridToScreen(gx, gy, 0, originX, originY);
            const b1 = gridToScreen(gx + deskW, gy, 0, originX, originY);
            const b2 = gridToScreen(gx + deskW, gy + deskH, 0, originX, originY);
            const b3 = gridToScreen(gx, gy + deskH, 0, originX, originY);

            // Bayangan Meja
            ctx.beginPath();
            ctx.moveTo(b0.x, b0.y); ctx.lineTo(b1.x, b1.y); ctx.lineTo(b2.x, b2.y); ctx.lineTo(b3.x, b3.y);
            ctx.closePath();
            ctx.fillStyle = "rgba(0, 0, 0, 0.3)";
            ctx.fill();

            // Sisi Kiri Meja
            ctx.beginPath();
            ctx.moveTo(t3.x, t3.y); ctx.lineTo(t2.x, t2.y); ctx.lineTo(b2.x, b2.y); ctx.lineTo(b3.x, b3.y);
            ctx.closePath();
            ctx.fillStyle = "#cbd5e1";
            ctx.fill();

            // Sisi Kanan Meja
            ctx.beginPath();
            ctx.moveTo(t2.x, t2.y); ctx.lineTo(t1.x, t1.y); ctx.lineTo(b1.x, b1.y); ctx.lineTo(b2.x, b2.y);
            ctx.closePath();
            ctx.fillStyle = "#94a3b8";
            ctx.fill();

            // Permukaan Atas Meja (Putih Clean)
            ctx.beginPath();
            ctx.moveTo(t0.x, t0.y); ctx.lineTo(t1.x, t1.y); ctx.lineTo(t2.x, t2.y); ctx.lineTo(t3.x, t3.y);
            ctx.closePath();
            ctx.fillStyle = isHovered ? "#ffffff" : "#f1f5f9";
            ctx.fill();
            ctx.strokeStyle = "#94a3b8";
            ctx.lineWidth = 1;
            ctx.stroke();

            // Monitor Komputer di Atas Meja
            const monPos = gridToScreen(gx + 0.2, gy + 0.2, deskZ + 2, originX, originY);
            ctx.beginPath();
            ctx.roundRect(monPos.x - 12, monPos.y - 18, 24, 15, 2);
            ctx.fillStyle = "#0f172a";
            ctx.fill();
            ctx.strokeStyle = isHovered ? "#38bdf8" : "#64748b";
            ctx.lineWidth = 1.5;
            ctx.stroke();

            // Layar Monitor menyala
            ctx.beginPath();
            ctx.roundRect(monPos.x - 10, monPos.y - 16, 20, 11, 1);
            ctx.fillStyle = "#1e1b4b";
            ctx.fill();

            // Chart Candlestick mini di Monitor
            ctx.fillStyle = "#22c55e"; ctx.fillRect(monPos.x - 7, monPos.y - 12, 3, 5);
            ctx.fillStyle = "#ef4444"; ctx.fillRect(monPos.x - 2, monPos.y - 14, 3, 7);
            ctx.fillStyle = "#22c55e"; ctx.fillRect(monPos.x + 3, monPos.y - 10, 3, 4);

            // Label Nama Role di Bawah Meja
            const labelPos = gridToScreen(gx + 0.4, gy + 0.9, 0, originX, originY);
            ctx.font = "700 10px 'Plus Jakarta Sans', sans-serif";
            ctx.fillStyle = "#a78bfa";
            ctx.textAlign = "center";
            ctx.fillText(label, labelPos.x, labelPos.y + 12);
        }

        // --- GAMBAR ROBOT HELMET (CYBORG) ---
        function drawCyborgRobot(x, y, color, floatOffset, isHovered) {
            const py = y + floatOffset;

            // Bayangan Robot
            ctx.beginPath();
            ctx.ellipse(x, y + 2, 12, 6, 0, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(0,0,0,0.35)";
            ctx.fill();

            if (isHovered) {
                ctx.shadowColor = color;
                ctx.shadowBlur = 12;
            }

            // Badan Robot
            ctx.beginPath();
            ctx.ellipse(x, py - 10, 12, 9, 0, 0, Math.PI * 2);
            ctx.fillStyle = "#334155";
            ctx.fill();

            // Helm Bulat Utama
            ctx.beginPath();
            ctx.arc(x, py - 24, 14, 0, Math.PI * 2);
            ctx.fillStyle = color;
            ctx.fill();
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 2;
            ctx.stroke();

            // Visor Hitam
            ctx.beginPath();
            ctx.roundRect(x - 9, py - 28, 18, 9, 4);
            ctx.fillStyle = "#0f172a";
            ctx.fill();

            // Mata Glow Magenta
            ctx.beginPath();
            ctx.arc(x - 4, py - 24, 2, 0, Math.PI * 2);
            ctx.arc(x + 4, py - 24, 2, 0, Math.PI * 2);
            ctx.fillStyle = "#ec4899";
            ctx.fill();

            // Telinga Headset
            ctx.beginPath();
            ctx.arc(x - 14, py - 24, 3, 0, Math.PI * 2);
            ctx.arc(x + 14, py - 24, 3, 0, Math.PI * 2);
            ctx.fillStyle = "#f43f5e";
            ctx.fill();

            ctx.shadowBlur = 0; // Reset
        }

        // --- BUBBLE CHAT ---
        function drawBubble(x, y, text, badgeColor, isHovered) {
            ctx.font = "700 11px 'Plus Jakarta Sans', sans-serif";
            const textWidth = ctx.measureText(text).width;
            const bw = textWidth + 28;
            const bh = 28;
            const bx = x - bw / 2;
            const by = y - 66;

            if (isHovered) {
                ctx.shadowColor = badgeColor;
                ctx.shadowBlur = 10;
            }

            // Body Bubble
            ctx.beginPath();
            ctx.roundRect(bx, by, bw, bh, 14);
            ctx.fillStyle = "#1e1b4b";
            ctx.fill();
            ctx.strokeStyle = badgeColor;
            ctx.lineWidth = 1.5;
            ctx.stroke();
            ctx.shadowBlur = 0;

            // Panah Bubble
            ctx.beginPath();
            ctx.moveTo(x - 4, by + bh);
            ctx.lineTo(x, by + bh + 5);
            ctx.lineTo(x + 4, by + bh);
            ctx.fillStyle = "#1e1b4b";
            ctx.fill();

            // Status Indicator Dot
            ctx.beginPath();
            ctx.arc(bx + 12, by + 14, 3.5, 0, Math.PI * 2);
            ctx.fillStyle = badgeColor;
            ctx.fill();

            // Text
            ctx.fillStyle = "#ffffff";
            ctx.textAlign = "left";
            ctx.fillText(text, bx + 22, by + 18);
        }

        // --- DATA ROBOT WORKFORCE ---
        const employees = [
            { 
                gx: 1, gy: 1, label: "Rara - Riset Pool", color: "#fbbf24", badgeColor: "#f59e0b",
                texts: ["Cek TVL & volume", "Liquidity Pool +18%", "Volume SOL naik 25%"], textIdx: 0 
            },
            { 
                gx: 3, gy: 1, label: "Bima - Manager", color: "#38bdf8", badgeColor: "#0284c7",
                texts: ["Fee $0.86 belum diklaim", "Staking APY 14.2%", "Rebalancing Portfolio"], textIdx: 0 
            },
            { 
                gx: 1, gy: 3, label: "Rala - Eksekutor", color: "#4ade80", badgeColor: "#16a34a",
                texts: ["PnL +$0.34", "Order Buy terpasang", "Gas fee optimal"], textIdx: 0 
            },
            { 
                gx: 3, gy: 3, label: "Fathata - Validator", color: "#c084fc", badgeColor: "#9333ea",
                texts: ["Lolos 2 pool audit", "Smart contract safe", "Signatures valid!"], textIdx: 0 
            },
            { 
                gx: 2, gy: 4.5, label: "Pandangan - Reporter", color: "#f43f5e", badgeColor: "#e11d48",
                texts: ["Laporan terkirim!", "Notifikasi Telegram ON", "Daily summary ready"], textIdx: 0 
            }
        ];

        let hoveredEmp = null;
        let offset = 0;

        // --- ANIMATION LOOP ---
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            offset += 0.04;

            const gridCols = 5;
            const gridRows = 6;

            // Titik Asal (Origin Center)
            const originX = canvas.width / 2;
            const originY = canvas.height / 2 - 40;

            // --- 1. GAMBAR DINDING LAVENDER (KIRI & KANAN) ---
            const wallH = 160; // Tinggi Dinding

            // Dinding Kiri
            const wL0 = gridToScreen(0, 0, 0, originX, originY);
            const wL1 = gridToScreen(0, gridRows, 0, originX, originY);
            const wL0_top = gridToScreen(0, 0, wallH, originX, originY);
            const wL1_top = gridToScreen(0, gridRows, wallH, originX, originY);

            ctx.beginPath();
            ctx.moveTo(wL0.x, wL0.y);
            ctx.lineTo(wL1.x, wL1.y);
            ctx.lineTo(wL1_top.x, wL1_top.y);
            ctx.lineTo(wL0_top.x, wL0_top.y);
            ctx.closePath();
            ctx.fillStyle = "#7c6899"; ctx.fill();
            ctx.strokeStyle = "#6b5788"; ctx.lineWidth = 1.5; ctx.stroke();

            // Dinding Kanan
            const wR1 = gridToScreen(gridCols, 0, 0, originX, originY);
            const wR1_top = gridToScreen(gridCols, 0, wallH, originX, originY);

            ctx.beginPath();
            ctx.moveTo(wL0.x, wL0.y);
            ctx.lineTo(wR1.x, wR1.y);
            ctx.lineTo(wR1_top.x, wR1_top.y);
            ctx.lineTo(wL0_top.x, wL0_top.y);
            ctx.closePath();
            ctx.fillStyle = "#8d77ad"; ctx.fill();
            ctx.strokeStyle = "#7b659b"; ctx.stroke();

            // --- DEKORASI DINDING ---
            // Jendela Kaca (Dinding Kiri)
            const win0 = gridToScreen(0, 1.5, 40, originX, originY);
            const win1 = gridToScreen(0, 4.5, 40, originX, originY);
            const win0_top = gridToScreen(0, 1.5, 110, originX, originY);
            const win1_top = gridToScreen(0, 4.5, 110, originX, originY);

            ctx.beginPath();
            ctx.moveTo(win0.x, win0.y); ctx.lineTo(win1.x, win1.y); ctx.lineTo(win1_top.x, win1_top.y); ctx.lineTo(win0_top.x, win0_top.y);
            ctx.closePath();
            ctx.fillStyle = "rgba(192, 132, 252, 0.25)"; ctx.fill();
            ctx.strokeStyle = "#c084fc"; ctx.lineWidth = 2; ctx.stroke();

            // Plang "DJIWA HQ" (Dinding Kanan)
            const signPos = gridToScreen(2.5, 0, 100, originX, originY);
            ctx.beginPath();
            ctx.roundRect(signPos.x - 45, signPos.y - 15, 90, 26, 6);
            ctx.fillStyle = "#1e1b4b"; ctx.fill();
            ctx.strokeStyle = "#c084fc"; ctx.lineWidth = 1.5; ctx.stroke();
            ctx.font = "800 10px 'Plus Jakarta Sans', sans-serif";
            ctx.fillStyle = "#ffffff"; ctx.textAlign = "center";
            ctx.fillText("DJIWA HQ WORKFORCE", signPos.x, signPos.y + 2);

            // --- 2. GAMBAR LANTAI CATUR PURPLE ---
            for (let gx = 0; gx < gridCols; gx++) {
                for (let gy = 0; gy < gridRows; gy++) {
                    const isEven = (gx + gy) % 2 === 0;
                    const tileColor = isEven ? "#52406d" : "#44335e";
                    drawTile(gx, gy, tileColor, "rgba(167, 139, 250, 0.15)", originX, originY);
                }
            }

            // --- 3. RENDERING KARYAWAN & MEJA (DEPTH SORTING) ---
            // Urutkan berdasarkan jarak isometric agar objek depan menutupi objek belakang dengan sempurna
            employees.sort((a, b) => (a.gx + a.gy) - (b.gx + b.gy));

            employees.forEach((emp, idx) => {
                const isHovered = (hoveredEmp === emp);
                const floatOffset = Math.sin(offset + idx * 1.5) * 4;

                // Render Meja Kerja
                drawDesk(emp.gx, emp.gy, emp.label, originX, originY, isHovered);

                // Posisi Robot di Belakang Meja (Di atas kursi)
                const robotPos = gridToScreen(emp.gx + 0.4, emp.gy + 0.3, 26, originX, originY);

                // Render Robot Cyborg
                drawCyborgRobot(robotPos.x, robotPos.y, emp.color, floatOffset, isHovered);

                // Render Bubble Chat
                const currentText = emp.texts[emp.textIdx];
                drawBubble(robotPos.x, robotPos.y + floatOffset, currentText, emp.badgeColor, isHovered);

                // Simpan area hit-test mouse
                emp.renderX = robotPos.x;
                emp.renderY = robotPos.y + floatOffset - 15;
            });

            requestAnimationFrame(animate);
        }

        // --- INTERAKSI MOUSE ---
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            hoveredEmp = employees.find(emp => {
                const dist = Math.hypot(mouseX - emp.renderX, mouseY - emp.renderY);
                return dist < 30;
            });
        });

        canvas.addEventListener('click', () => {
            if (hoveredEmp) {
                hoveredEmp.textIdx = (hoveredEmp.textIdx + 1) % hoveredEmp.texts.length;
            }
        });

        // Jalankan
        animate();
    </script>
</body>
</html>
