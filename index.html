<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DJIWA Labs - Pusat Komando</title>
    <style>
        body { margin: 0; padding: 0; background-color: #0d1117; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: white; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .dashboard { width: 90%; max-width: 1000px; background-color: #161b22; border-radius: 15px; padding: 20px; margin-top: 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 15px rgba(0,0,0,0.5); border: 1px solid #30363d; box-sizing: border-box; }
        .dashboard h2 { margin: 0; font-size: 20px; letter-spacing: 2px; color: #58a6ff; }
        .stats-container { display: flex; gap: 15px; }
        .stat-box { background-color: #21262d; padding: 10px 20px; border-radius: 10px; text-align: left; min-width: 120px; }
        .stat-box span { display: block; font-size: 12px; color: #8b949e; margin-bottom: 5px; }
        .stat-box strong { font-size: 20px; }
        .profit { color: #3fb950; }
        .loss { color: #f85149; }
        
        .office-container { position: relative; width: 95%; max-width: 1000px; margin-top: 20px; border-radius: 15px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.8); aspect-ratio: 1280 / 698; }
        .office-bg { width: 100%; height: 100%; object-fit: cover; display: block; }
        
        /* Styling Bubble Chat */
        .bubble { position: absolute; background: white; border-radius: 15px; padding: 8px 12px; font-size: 13px; font-weight: bold; color: #333; box-shadow: 0 4px 10px rgba(0,0,0,0.5); white-space: nowrap; animation: float 3s ease-in-out infinite; z-index: 10; }
        .bubble::after { content: ''; position: absolute; bottom: -8px; left: 50%; transform: translateX(-50%); border-width: 8px 8px 0; border-style: solid; border-color: white transparent transparent transparent; }
        
        /* Posisi Bubble */
        .bubble-raja { top: 18%; left: 32%; transform: translateX(-50%); }
        .bubble-panongani { top: 20%; left: 75%; transform: translateX(-50%); }
        .bubble-siboru { top: 50%; left: 12%; transform: translateX(-50%); }
        .bubble-parhata { top: 62%; left: 65%; transform: translateX(-50%); }
        
        @keyframes float { 0% { transform: translateY(0px) translateX(-50%); } 50% { transform: translateY(-8px) translateX(-50%); } 100% { transform: translateY(0px) translateX(-50%); } }
        
        @media (max-width: 600px) { .dashboard { flex-direction: column; gap: 10px; padding: 15px; text-align: center; } .stats-container { flex-wrap: wrap; justify-content: center; } .stat-box { padding: 8px 12px; min-width: 90px; } .stat-box strong { font-size: 16px; } .bubble { font-size: 8px; padding: 4px 6px; border-radius: 8px; } .bubble::after { border-width: 5px 5px 0; bottom: -5px; } }
    </style>
</head>
<body>
    <div class="dashboard">
        <h2>PAPAN KINERJA</h2>
        <div class="stats-container">
            <div class="stat-box">
                <span>PnL Total</span>
                <strong id="pnl-total" class="profit">+$17684.36</strong>
            </div>
            <div class="stat-box">
                <span>PnL Mengambang</span>
                <strong id="pnl-mengambang" class="profit">+$17684.36</strong>
            </div>
            <div class="stat-box">
                <span>Posisi Terbuka</span>
                <strong id="posisi-terbuka">5/5</strong>
            </div>
        </div>
    </div>

    <div class="office-container">
        <img src="kantor_utama.png" alt="Kantor DJIWA" class="office-bg">
        
        <!-- Bubble dengan ID khusus agar mudah diganti oleh Python -->
        <div class="bubble bubble-raja" id="bubble-raja">Buka posisi Token!</div>
        <div class="bubble bubble-panongani" id="bubble-panongani">Lapor Bos, ada posisi!</div>
        <div class="bubble bubble-siboru" id="bubble-siboru">Radar temukan 40 token!</div>
        <div class="bubble bubble-parhata" id="bubble-parhata">Lolos 2 pool.</div>
    </div>
</body>
</html>
