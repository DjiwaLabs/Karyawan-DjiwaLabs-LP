<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DJIWA Labs - 3D Isometric Virtual Office</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        
        * { 
            box-sizing: border-box; 
            user-select: none; 
            margin: 0; 
            padding: 0; 
        }

        body { 
            background: #0f0c1b; 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: flex-start; 
            overflow: hidden; 
            color: #ffffff; 
            height: 100vh; 
            width: 100vw; 
        }

        /* Top Dashboard Glassmorphic Header */
        .dashboard { 
            width: 92%; 
            max-width: 1000px; 
            background: rgba(26, 20, 46, 0.75); 
            backdrop-filter: blur(16px); 
            -webkit-backdrop-filter: blur(16px); 
            border-radius: 20px; 
            padding: 14px 28px; 
            margin-top: 16px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.15); 
            border: 1px solid rgba(167, 139, 250, 0.2); 
            z-index: 10; 
        }

        .brand { 
            display: flex; 
            align-items: center; 
            gap: 14px; 
        }

        .status-dot { 
            width: 12px; 
            height: 12px; 
            background-color: #10b981; 
            border-radius: 50%; 
            box-shadow: 0 0 12px #10b981; 
            animation: pulse 2s infinite; 
        }

        @keyframes pulse { 
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); } 
            70% { transform: scale(1.05); box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); } 
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); } 
        }

        .brand h2 { 
            font-size: 20px; 
            font-weight: 800; 
            background: linear-gradient(135deg, #c084fc 0%, #38bdf8 100%); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
            letter-spacing: 1.5px; 
        }

        .stats { 
            display: flex; 
            gap: 28px; 
        }

        .stat { 
            display: flex; 
            flex-direction: column; 
            align-items: flex-end; 
        }

        .stat span { 
            font-size: 10px; 
            color: #a78bfa; 
            font-weight: 700; 
            text-transform: uppercase; 
            letter-spacing: 0.8px; 
        }

        .stat strong { 
            font-size: 15px; 
            color: #34d399; 
            font-weight: 700; 
        }

        .stat strong.badge { 
            background: rgba(52, 211, 153, 0.12); 
            padding: 3px 12px; 
            border-radius: 8px; 
            border: 1px solid rgba(52, 211, 153, 0.3); 
        }

        canvas { 
            display: block; 
            cursor: default; 
            touch-action: none;
        }

        .instructions { 
            position: absolute; 
            bottom: 16px; 
            font-size: 12px; 
            font-weight: 600;
            color: #d8b4fe; 
            background: rgba(22, 17, 41, 0.9); 
            backdrop-filter: blur(8px);
            padding: 8px 22px; 
            border-radius: 30px; 
            border: 1px solid rgba(167, 139, 250, 0.3); 
            pointer-events: none; 
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4); 
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .instructions span {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #38bdf8;
            border-radius: 50%;
            box-shadow: 0 0 8px #38bdf8;
        }
    </style>
</head>
<body>

    <div class="dashboard">
        <div class="brand">
            <div class="status-dot"></div>
            <h2>DJIWA LABS</h2>
        </div>
        <div class="stats">
            <div class="stat"><span>PnL Total</span><strong class="badge" id="pnl-total">+$18,374.56</strong></div>
            <div class="stat"><span>Posisi Aktif</span><strong id="posisi-terbuka">5 / 5</strong></div>
            <div class="stat"><span>Saldo Web3</span><strong style="color:#38bdf8;" id="saldo-devnet">20.00 SOL</strong></div>
        </div>
    </div>

    <canvas id="officeCanvas"></canvas>
    <div class="instructions"><span></span> Arahkan kursor & klik robot untuk melihat status & merubah tampilan monitor</div>

    <script>
        const canvas = document.getElementById('officeCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // --- KONFIGURASI GRID ISOMETRIK ---
        const GRID_ROWS = 8;
        const GRID_COLS = 8;
        const TILE_WIDTH = 64;
        const TILE_HEIGHT = 32;

        function gridToScreen(gx, gy, originX, originY) {
            return {
                x: originX + (gx - gy) * TILE_WIDTH,
                y: originY + (gx + gy) * TILE_HEIGHT
            };
        }

        // Helper Gambar Box 3D Isometric
        function drawIsoBox(x, y, w, h, d, colorTop, colorLeft, colorRight) {
            // Sisi Atas
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x + w, y + w * 0.5);
            ctx.lineTo(x, y + w);
            ctx.lineTo(x - w, y + w * 0.5);
            ctx.closePath();
            ctx.fillStyle = colorTop;
            ctx.fill();

            // Sisi Kiri
            ctx.beginPath();
            ctx.moveTo(x - w, y + w * 0.5);
            ctx.lineTo(x, y + w);
            ctx.lineTo(x, y + w + h);
            ctx.lineTo(x - w, y + w * 0.5 + h);
            ctx.closePath();
            ctx.fillStyle = colorLeft;
            ctx.fill();

            // Sisi Kanan
            ctx.beginPath();
            ctx.moveTo(x, y + w);
            ctx.lineTo(x + w, y + w * 0.5);
            ctx.lineTo(x + w, y + w * 0.5 + h);
            ctx.lineTo(x, y + w + h);
            ctx.closePath();
            ctx.fillStyle = colorRight;
            ctx.fill();
        }

        // Draw Server Rack / Rak Buku Cyber
        function drawServerRack(x, y) {
            drawIsoBox(x, y, 26, 75, 26, "#1e1b4b", "#111827", "#1f2937");
            
            // Neon LEDs
            for (let i = 0; i < 6; i++) {
                const ly = y + 18 + i * 9;
                ctx.fillStyle = i % 2 === 0 ? "#10b981" : "#38bdf8";
                ctx.fillRect(x - 14, ly, 4, 3);
                ctx.fillStyle = "#ef4444";
                ctx.fillRect(x - 8, ly, 4, 3);
                
                // Lines
                ctx.strokeStyle = "rgba(167, 139, 250, 0.4)";
                ctx.beginPath();
                ctx.moveTo(x - 2, ly + 1);
                ctx.lineTo(x + 16, ly - 8);
                ctx.stroke();
            }
        }

        // Draw Pot Tanaman Futuristik
        function drawPlant(x, y) {
            drawIsoBox(x, y + 10, 14, 20, 14, "#334155", "#1e293b", "#0f172a");
            
            // Daun/Bunga Cyber Glowing
            ctx.beginPath();
            ctx.arc(x, y - 12, 16, 0, Math.PI * 2);
            ctx.fillStyle = "#059669";
            ctx.fill();
            
            ctx.beginPath();
            ctx.arc(x - 3, y - 16, 10, 0, Math.PI * 2);
            ctx.fillStyle = "#10b981";
            ctx.fill();

            ctx.beginPath();
            ctx.arc(x + 5, y - 10, 6, 0, Math.PI * 2);
            ctx.fillStyle = "#34d399";
            ctx.fill();
        }

        // --- MEJA WORKSTATION MODERN ---
        function drawDesk(x, y, isHovered, labelText, monitorState) {
            // Shadow Meja
            ctx.beginPath();
            ctx.ellipse(x, y + 26, 42, 20, 0, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(5, 4, 12, 0.55)";
            ctx.fill();
            
            // Kaki Meja Metal
            ctx.fillStyle = "#334155";
            ctx.fillRect(x - 30, y + 15, 5, 20);
            ctx.fillRect(x + 25, y + 15, 5, 20);

            // Permukaan Meja Isometric
            const deskW = 38;
            drawIsoBox(
                x, y, deskW, 14, deskW, 
                isHovered ? "#ffffff" : "#f1f5f9", 
                isHovered ? "#cbd5e1" : "#94a3b8", 
                isHovered ? "#94a3b8" : "#64748b"
            );

            // Dual Screen Monitor / Laptop (Menghadap Kursi/Robot)
            const mx = x - 8;
            const my = y - 16;
            
            // Penyangga Screen
            ctx.fillStyle = "#475569";
            ctx.fillRect(mx + 6, my + 10, 6, 8);

            // Frame Layar Monitor Utama
            ctx.beginPath();
            ctx.roundRect(mx - 10, my - 12, 34, 20, 3);
            ctx.fillStyle = "#0f172a";
            ctx.fill();
            ctx.strokeStyle = isHovered ? "#a78bfa" : "#334155";
            ctx.lineWidth = 1.5;
            ctx.stroke();

            // Isi Layar Monitor (Berubah Sesuai State)
            ctx.beginPath();
            ctx.roundRect(mx - 8, my - 10, 30, 16, 2);
            if (monitorState === 0) {
                ctx.fillStyle = "#090d16"; ctx.fill();
                // Graphic Candlestick Bullish/Bearish
                ctx.fillStyle = "#10b981";
                ctx.fillRect(mx - 4, my - 6, 3, 10);
                ctx.fillRect(mx + 4, my - 8, 3, 12);
                ctx.fillStyle = "#ef4444";
                ctx.fillRect(mx, my - 2, 3, 8);
                ctx.fillRect(mx + 8, my - 4, 3, 6);
            } else if (monitorState === 1) {
                ctx.fillStyle = "#022c22"; ctx.fill();
                // Matrix Code Lines
                ctx.fillStyle = "#34d399";
                ctx.fillRect(mx - 6, my - 7, 16, 2);
                ctx.fillRect(mx - 6, my - 3, 22, 2);
                ctx.fillRect(mx - 6, my + 1, 12, 2);
            } else {
                ctx.fillStyle = "#2e1065"; ctx.fill();
                // Radar / Analytics Circular Chart
                ctx.beginPath();
                ctx.arc(mx + 7, my - 2, 5, 0, Math.PI * 2);
                ctx.strokeStyle = "#c084fc";
                ctx.lineWidth = 1.5;
                ctx.stroke();
            }

            // Keyboard & Mouse Pad di Meja
            ctx.fillStyle = "#1e293b";
            ctx.fillRect(x - 12, y + 8, 16, 7);
            ctx.fillStyle = "#38bdf8";
            ctx.fillRect(x + 7, y + 10, 4, 5);

            // Label Nama Karakter (Tampak Jelas di Depan Meja)
            ctx.font = "800 11px 'Plus Jakarta Sans', sans-serif";
            ctx.fillStyle = isHovered ? "#38bdf8" : "#cbd5e1";
            ctx.textAlign = "center";
            ctx.shadowColor = "rgba(0, 0, 0, 0.8)";
            ctx.shadowBlur = 4;
            ctx.fillText(labelText, x, y + 44);
            ctx.shadowBlur = 0;
        }

        // --- CYBORG ROBOT (MENGHADAP MEJA/MONITOR) ---
        function drawCyborgRobot(x, y, color, isHovered) {
            const floatY = y - 28; // Duduk pas di depan meja

            // Shadow Melayang Robot
            ctx.beginPath();
            ctx.ellipse(x, y + 5, 12, 6, 0, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(0, 0, 0, 0.4)";
            ctx.fill();

            // Glow Aura jika Hovered
            if (isHovered) {
                ctx.shadowColor = color;
                ctx.shadowBlur = 18;
            }

            // Body Robot
            ctx.beginPath();
            ctx.arc(x, floatY + 12, 13, 0, Math.PI * 2);
            ctx.fillStyle = color;
            ctx.fill();
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 1.5;
            ctx.stroke();

            // Punggung / Detail Jaket Robot (Karena membelakangi kita)
            ctx.beginPath();
            ctx.arc(x, floatY + 12, 8, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(15, 23, 42, 0.6)";
            ctx.fill();

            // Kepala Robot (Tampak Belakang/Samping Helm)
            ctx.beginPath();
            ctx.arc(x, floatY - 2, 11, 0, Math.PI * 2);
            ctx.fillStyle = "#1e1b4b";
            ctx.fill();
            ctx.strokeStyle = color;
            ctx.lineWidth = 2;
            ctx.stroke();

            // Helm Gloss Visor (Belakang)
            ctx.beginPath();
            ctx.arc(x, floatY - 2, 8, Math.PI * 0.8, Math.PI * 2.2);
            ctx.fillStyle = color;
            ctx.fill();

            // Antena & Ear Lights
            ctx.beginPath();
            ctx.moveTo(x, floatY - 13);
            ctx.lineTo(x, floatY - 22);
            ctx.strokeStyle = color;
            ctx.lineWidth = 2.5;
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(x, floatY - 22, 3.5, 0, Math.PI * 2);
            ctx.fillStyle = isHovered ? "#38bdf8" : "#f43f5e";
            ctx.fill();

            ctx.shadowBlur = 0; // Reset Shadow
        }

        // --- DIALOG BUBBLE NEON ---
        function drawBubble(x, y, text, isHovered, dotColor) {
            ctx.font = "700 12px 'Plus Jakarta Sans', sans-serif";
            const textWidth = ctx.measureText(text).width;
            const bw = textWidth + 36;
            const bh = 32;
            const bx = x - bw / 2;
            const by = y - 82; // Diposisikan lebih tinggi agar tidak menutupi robot

            if (isHovered) {
                ctx.shadowColor = dotColor;
                ctx.shadowBlur = 12;
            }

            // Body Bubble
            ctx.beginPath();
            ctx.roundRect(bx, by, bw, bh, 14);
            ctx.fillStyle = "rgba(15, 12, 29, 0.92)";
            ctx.fill();
            ctx.strokeStyle = isHovered ? dotColor : "rgba(167, 139, 250, 0.35)";
            ctx.lineWidth = 1.5;
            ctx.stroke();
            ctx.shadowBlur = 0;

            // Ekor Bubble Panah Kecil
            ctx.beginPath();
            ctx.moveTo(x - 5, by + bh);
            ctx.lineTo(x, by + bh + 6);
            ctx.lineTo(x + 5, by + bh);
            ctx.fillStyle = "rgba(15, 12, 29, 0.92)";
            ctx.fill();

            // Dot Lampu Indicator Status
            ctx.beginPath();
            ctx.arc(bx + 16, by + 16, 4.5, 0, Math.PI * 2);
            ctx.fillStyle = dotColor;
            ctx.shadowColor = dotColor;
            ctx.shadowBlur = 6;
            ctx.fill();
            ctx.shadowBlur = 0;

            // Teks Status Pesan
            ctx.fillStyle = "#ffffff";
            ctx.textAlign = "left";
            ctx.fillText(text, bx + 28, by + 20);
        }

        // --- DATA EMPLOYEES (DILAYOUT RAPI DAN SIMETRIS DI KIRI DAN KANAN) ---
        // Menjaga SEMUA nama, label, warna, dan teks asli 100%
        const employees = [
            // SAYAP KIRI (LEFT WING)
            { gx: 2.2, gy: 5.5, color: "#f59e0b", dotColor: "#f59e0b", label: "Siboru - Scanner", texts: ["Radar temukan 40 token", "Cek TVL & Volume"], textIdx: 0, monitorState: 0 },
            { gx: 2.2, gy: 3.5, color: "#ef4444", dotColor: "#f43f5e", label: "Raja - Eksekutor", texts: ["Beli CBUCKS!", "Take Profit +50%!"], textIdx: 0, monitorState: 2 },
            { gx: 2.2, gy: 1.5, color: "#8b5cf6", dotColor: "#a78bfa", label: "Parhata - Validator", texts: ["Lolos 2 pool.", "Cek Scam & Honeypot"], textIdx: 0, monitorState: 1 },

            // SAYAP KANAN (RIGHT WING)
            { gx: 5.5, gy: 5.5, color: "#3b82f6", dotColor: "#60a5fa", label: "Panongani - Reporter", texts: ["Laporan terkirim", "Update PnL ke Discord"], textIdx: 0, monitorState: 0 },
            { gx: 5.5, gy: 3.5, color: "#10b981", dotColor: "#34d399", label: "Pande - Web3", texts: ["Fee $0.86 belum diklaim", "Saldo Devnet 20 SOL"], textIdx: 0, monitorState: 1 },
            { gx: 5.5, gy: 1.5, color: "#f97316", dotColor: "#fb923c", label: "Ompu - Keamanan", texts: ["Validasi Transaksi", "Sanitasi Error OK"], textIdx: 0, monitorState: 2 }
        ];

        let hoveredEmp = null;
        let animOffset = 0;

        // --- LOOP ANIMASI UTAMA ---
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            animOffset += 0.04;

            const originX = canvas.width / 2;
            const originY = canvas.height / 2 - 80;

            const pTop = gridToScreen(0, 0, originX, originY);
            const pLeft = gridToScreen(0, GRID_ROWS, originX, originY);
            const pRight = gridToScreen(GRID_COLS, 0, originX, originY);
            const wallHeight = 240;

            // --- 1. DINDING RUANGAN (ISOMETRIC WALLS) ---
            // Dinding Kiri
            ctx.beginPath();
            ctx.moveTo(pTop.x, pTop.y);
            ctx.lineTo(pLeft.x, pLeft.y);
            ctx.lineTo(pLeft.x, pLeft.y - wallHeight);
            ctx.lineTo(pTop.x, pTop.y - wallHeight);
            ctx.closePath();
            ctx.fillStyle = "#1e1a38";
            ctx.fill();
            ctx.strokeStyle = "rgba(167, 139, 250, 0.15)";
            ctx.lineWidth = 1.5;
            ctx.stroke();

            // Dinding Kanan
            ctx.beginPath();
            ctx.moveTo(pTop.x, pTop.y);
            ctx.lineTo(pRight.x, pRight.y);
            ctx.lineTo(pRight.x, pRight.y - wallHeight);
            ctx.lineTo(pTop.x, pTop.y - wallHeight);
            ctx.closePath();
            ctx.fillStyle = "#252044";
            ctx.fill();
            ctx.strokeStyle = "rgba(167, 139, 250, 0.15)";
            ctx.stroke();

            // Dekorasi Dinding (Jendela Futuristik & Jam Dinding Digital)
            // Jendela Kiri
            ctx.fillStyle = "rgba(56, 189, 248, 0.08)";
            ctx.fillRect(pTop.x - 140, pTop.y - 170, 80, 100);
            ctx.strokeStyle = "rgba(56, 189, 248, 0.4)";
            ctx.lineWidth = 2;
            ctx.strokeRect(pTop.x - 140, pTop.y - 170, 80, 100);

            // Frame Neon Jendela
            ctx.strokeStyle = "#38bdf8";
            ctx.beginPath();
            ctx.moveTo(pTop.x - 140, pTop.y - 120);
            ctx.lineTo(pTop.x - 60, pTop.y - 120);
            ctx.stroke();

            // Logo Header DJIWA HQ di Dinding Kanan
            ctx.fillStyle = "rgba(30, 27, 75, 0.8)";
            ctx.fillRect(pTop.x + 40, pTop.y - 180, 140, 45);
            ctx.strokeStyle = "#a78bfa";
            ctx.lineWidth = 1.5;
            ctx.strokeRect(pTop.x + 40, pTop.y - 180, 140, 45);

            ctx.font = "800 15px 'Plus Jakarta Sans', sans-serif";
            ctx.fillStyle = "#38bdf8";
            ctx.textAlign = "left";
            ctx.fillText("DJIWA HQ ⚡", pTop.x + 55, pTop.y - 152);

            // Jam Dinding Digital Dynamic
            const now = new Date();
            const timeStr = now.toTimeString().split(' ')[0];
            ctx.font = "700 11px monospace";
            ctx.fillStyle = "#34d399";
            ctx.fillText(timeStr, pTop.x + 60, pTop.y - 164);

            // --- 2. LANTAI GRID ISOMETRIK ---
            for (let r = 0; r < GRID_ROWS; r++) {
                for (let c = 0; c < GRID_COLS; c++) {
                    const pos = gridToScreen(r, c, originX, originY);
                    const isEven = (r + c) % 2 === 0;
                    
                    // Warna Ubin Premium Dark/Purple
                    drawIsoBox(
                        pos.x, pos.y, TILE_WIDTH, 8, TILE_WIDTH, 
                        isEven ? "#2b2447" : "#241e3d", 
                        isEven ? "#1d1833" : "#18142b", 
                        isEven ? "#18142b" : "#131024"
                    );
                }
            }

            // Karpet Neon / Pathway Koridor Tengah
            for (let r = 1; r < 7; r++) {
                const carpetPos = gridToScreen(r, 3.8, originX, originY);
                drawIsoBox(carpetPos.x, carpetPos.y, TILE_WIDTH, 1, TILE_WIDTH * 0.4, "rgba(56, 189, 248, 0.12)", "transparent", "transparent");
            }

            // --- 3. PROPS & DEKORASI INTERIOR ---
            drawServerRack(gridToScreen(0.5, 0.5, originX, originY).x, gridToScreen(0.5, 0.5, originX, originY).y);
            drawPlant(gridToScreen(0.5, 7.2, originX, originY).x, gridToScreen(0.5, 7.2, originX, originY).y);
            drawPlant(gridToScreen(7.2, 0.5, originX, originY).x, gridToScreen(7.2, 0.5, originX, originY).y);

            // --- 4. RENDER WORKSTATION & KARAKTER ---
            // Urutkan berdasarkan kedalaman z-index (gx + gy) agar render bertumpuk sempurna
            const sortedEmployees = [...employees].sort((a, b) => (a.gx + a.gy) - (b.gx + b.gy));

            sortedEmployees.forEach((emp, idx) => {
                const pos = gridToScreen(emp.gx, emp.gy, originX, originY);
                const isHovered = (hoveredEmp === emp);
                
                // Animasi melayang robot yang teratur
                const floatY = Math.sin(animOffset * 1.8 + idx * 1.2) * 3;

                // Render Meja
                drawDesk(pos.x, pos.y, isHovered, emp.label, emp.monitorState);
                
                // Render Robot
                drawCyborgRobot(pos.x, pos.y + floatY, emp.color, isHovered);
                
                // Render Bubble Status Pesan
                drawBubble(pos.x, pos.y + floatY, emp.texts[emp.textIdx], isHovered, emp.dotColor);

                // Area Hitbox Hover & Click
                emp.renderX = pos.x;
                emp.renderY = pos.y + floatY;
            });

            requestAnimationFrame(animate);
        }

        // --- INTERAKSI MOUSE & HOVER ---
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            // Deteksi Hover pada Robot & Meja
            hoveredEmp = employees.find(emp => {
                const dist = Math.hypot(mouseX - emp.renderX, mouseY - (emp.renderY - 20));
                return dist < 42;
            });

            canvas.style.cursor = hoveredEmp ? 'pointer' : 'default';
        });

        canvas.addEventListener('click', () => {
            if (hoveredEmp) {
                // Toggle Pesan Teks
                hoveredEmp.textIdx = (hoveredEmp.textIdx + 1) % hoveredEmp.texts.length;
                
                // Toggle Tampilan Grafik Monitor Laptop
                hoveredEmp.monitorState = (hoveredEmp.monitorState + 1) % 3;
            }
        });

        // Jalankan Animasi Canvas
        animate();
    </script>
</body>
</html>
