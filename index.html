<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DJIWA Labs - Isometric Web3 Office</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        
        * {
            box-sizing: border-box;
            user-select: none;
        }

        body { 
            margin: 0; 
            padding: 0; 
            background: #0d1117; 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            overflow: hidden; 
            color: #c9d1d9; 
        }
        
        /* Glassmorphism Dashboard Header */
        .dashboard { 
            width: 90%; 
            max-width: 900px; 
            background: rgba(22, 27, 34, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 16px; 
            padding: 14px 28px; 
            margin-top: 20px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            z-index: 10; 
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background-color: #2ea043;
            border-radius: 50%;
            box-shadow: 0 0 10px #2ea043;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(46, 160, 67, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(46, 160, 67, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(46, 160, 67, 0); }
        }

        .dashboard h2 { 
            margin: 0; 
            font-size: 18px; 
            font-weight: 800;
            background: linear-gradient(135deg, #58a6ff 0%, #bc8cff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }

        .stats { 
            display: flex; 
            gap: 24px; 
        }

        .stat {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .stat span { 
            font-size: 11px; 
            color: #8b949e; 
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat strong { 
            font-size: 16px; 
            color: #3fb950; 
            font-weight: 700;
        }

        .stat strong.badge {
            background: rgba(46, 160, 67, 0.15);
            padding: 2px 8px;
            border-radius: 6px;
            border: 1px solid rgba(46, 160, 67, 0.3);
        }

        canvas { 
            display: block; 
            cursor: pointer;
        }

        .instructions {
            position: absolute;
            bottom: 15px;
            font-size: 12px;
            color: #8b949e;
            background: rgba(13, 17, 23, 0.6);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="dashboard">
        <div class="brand">
            <div class="status-dot"></div>
            <h2>DJIWA LABS</h2>
        </div>
        <div class="stats">
            <div class="stat"><span>PnL Total</span><strong class="badge">+$18,374.56</strong></div>
            <div class="stat"><span>Posisi Aktif</span><strong>5 / 5</strong></div>
            <div class="stat"><span>Saldo Web3</span><strong style="color:#58a6ff;">20.00 SOL</strong></div>
        </div>
    </div>

    <canvas id="officeCanvas"></canvas>
    <div class="instructions">💡 Klik karakter untuk berinteraksi dengan pesan mereka</div>

    <script>
        const canvas = document.getElementById('officeCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight - 80;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // --- PARTIKEL DEKORATIF BACKGROUND ---
        const particles = Array.from({ length: 30 }, () => ({
            x: Math.random() * window.innerWidth,
            y: Math.random() * window.innerHeight,
            size: Math.random() * 2 + 1,
            speedY: Math.random() * 0.5 + 0.2,
            opacity: Math.random() * 0.5 + 0.2
        }));

        function drawParticles() {
            particles.forEach(p => {
                p.y -= p.speedY;
                if (p.y < 0) p.y = canvas.height;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(88, 166, 255, ${p.opacity})`;
                ctx.fill();
            });
        }

        // --- DRAWING UTILS ---
        function drawIsometricBox(x, y, w, h, d, colorTop, colorLeft, colorRight) {
            // Top face
            ctx.beginPath(); 
            ctx.moveTo(x, y); 
            ctx.lineTo(x + w, y + w / 2); 
            ctx.lineTo(x, y + w); 
            ctx.lineTo(x - w, y + w / 2); 
            ctx.closePath(); 
            ctx.fillStyle = colorTop; 
            ctx.fill();

            // Left face
            ctx.beginPath(); 
            ctx.moveTo(x - w, y + w / 2); 
            ctx.lineTo(x, y + w); 
            ctx.lineTo(x, y + w + h); 
            ctx.lineTo(x - w, y + w / 2 + h); 
            ctx.closePath(); 
            ctx.fillStyle = colorLeft; 
            ctx.fill();

            // Right face
            ctx.beginPath(); 
            ctx.moveTo(x, y + w); 
            ctx.lineTo(x + w, y + w / 2); 
            ctx.lineTo(x + w, y + w / 2 + h); 
            ctx.lineTo(x, y + w + h); 
            ctx.closePath(); 
            ctx.fillStyle = colorRight; 
            ctx.fill();
        }

        // --- BENTUK KARAKTER (VARIASI LEBIH LENGKAP) ---
        function drawAlien(x, y, color) {
            // Bayangan
            ctx.beginPath(); ctx.ellipse(x, y + 5, 18, 8, 0, 0, Math.PI * 2); ctx.fillStyle = "rgba(0,0,0,0.3)"; ctx.fill();
            // Kepala
            ctx.beginPath(); ctx.arc(x, y - 15, 15, 0, Math.PI * 2); ctx.fillStyle = color; ctx.fill();
            // Antena
            ctx.beginPath(); ctx.moveTo(x - 6, y - 28); ctx.lineTo(x - 12, y - 38); ctx.strokeStyle = color; ctx.lineWidth = 3; ctx.stroke();
            ctx.beginPath(); ctx.arc(x - 12, y - 38, 4, 0, Math.PI * 2); ctx.fillStyle = "#58a6ff"; ctx.fill();
            ctx.beginPath(); ctx.moveTo(x + 6, y - 28); ctx.lineTo(x + 12, y - 38); ctx.stroke();
            ctx.beginPath(); ctx.arc(x + 12, y - 38, 4, 0, Math.PI * 2); ctx.fillStyle = "#58a6ff"; ctx.fill();
            // Mata Glow
            ctx.beginPath(); ctx.arc(x - 5, y - 15, 3.5, 0, Math.PI * 2); ctx.arc(x + 5, y - 15, 3.5, 0, Math.PI * 2); ctx.fillStyle = "#ffffff"; ctx.fill();
            ctx.beginPath(); ctx.arc(x - 5, y - 15, 1.5, 0, Math.PI * 2); ctx.arc(x + 5, y - 15, 1.5, 0, Math.PI * 2); ctx.fillStyle = "#0d1117"; ctx.fill();
        }

        function drawRobot(x, y, color) {
            ctx.beginPath(); ctx.ellipse(x, y + 5, 18, 8, 0, 0, Math.PI * 2); ctx.fillStyle = "rgba(0,0,0,0.3)"; ctx.fill();
            // Badan
            ctx.beginPath(); ctx.roundRect(x - 14, y - 22, 28, 22, 4); ctx.fillStyle = color; ctx.fill();
            ctx.strokeStyle = "rgba(255,255,255,0.2)"; ctx.lineWidth = 1.5; ctx.stroke();
            // Kepala
            ctx.beginPath(); ctx.roundRect(x - 11, y - 38, 22, 15, 4); ctx.fillStyle = "#30363d"; ctx.fill();
            ctx.strokeStyle = color; ctx.lineWidth = 1.5; ctx.stroke();
            // Visor / Mata Cyan
            ctx.beginPath(); ctx.roundRect(x - 8, y - 33, 16, 5, 2); ctx.fillStyle = "#58a6ff"; ctx.fill();
            ctx.shadowColor = "#58a6ff"; ctx.shadowBlur = 8; ctx.fill(); ctx.shadowBlur = 0;
        }

        function drawBlob(x, y, color) {
            ctx.beginPath(); ctx.ellipse(x, y + 5, 18, 8, 0, 0, Math.PI * 2); ctx.fillStyle = "rgba(0,0,0,0.3)"; ctx.fill();
            ctx.beginPath(); 
            ctx.moveTo(x - 15, y); 
            ctx.bezierCurveTo(x - 20, y - 30, x + 20, y - 30, x + 15, y); 
            ctx.bezierCurveTo(x + 15, y + 5, x + 10, y + 8, x, y + 5); 
            ctx.bezierCurveTo(x - 10, y + 8, x - 15, y + 5, x - 15, y); 
            ctx.fillStyle = color; ctx.fill();
            // Mata Cute
            ctx.beginPath(); ctx.arc(x - 5, y - 12, 4, 0, Math.PI * 2); ctx.arc(x + 5, y - 12, 4, 0, Math.PI * 2); ctx.fillStyle = "white"; ctx.fill();
            ctx.beginPath(); ctx.arc(x - 4, y - 12, 2, 0, Math.PI * 2); ctx.arc(x + 6, y - 12, 2, 0, Math.PI * 2); ctx.fillStyle = "#161b22"; ctx.fill();
        }

        function drawCat(x, y, color) {
            ctx.beginPath(); ctx.ellipse(x, y + 5, 18, 8, 0, 0, Math.PI * 2); ctx.fillStyle = "rgba(0,0,0,0.3)"; ctx.fill();
            // Kepala Kucing
            ctx.beginPath(); ctx.arc(x, y - 15, 14, 0, Math.PI * 2); ctx.fillStyle = color; ctx.fill();
            // Telinga Kiri & Kanan
            ctx.beginPath(); ctx.moveTo(x - 12, y - 22); ctx.lineTo(x - 15, y - 34); ctx.lineTo(x - 4, y - 26); ctx.fillStyle = color; ctx.fill();
            ctx.beginPath(); ctx.moveTo(x + 12, y - 22); ctx.lineTo(x + 15, y - 34); ctx.lineTo(x + 4, y - 26); ctx.fillStyle = color; ctx.fill();
            // Mata & Hidung
            ctx.beginPath(); ctx.arc(x - 5, y - 15, 2.5, 0, Math.PI * 2); ctx.arc(x + 5, y - 15, 2.5, 0, Math.PI * 2); ctx.fillStyle = "#3fb950"; ctx.fill();
            ctx.beginPath(); ctx.arc(x, y - 11, 1.5, 0, Math.PI * 2); ctx.fillStyle = "#ff7b72"; ctx.fill();
        }

        // --- CHAT BUBBLE EFEK GLOW ---
        function drawBubble(x, y, text, isHovered = false) {
            ctx.font = "600 12px 'Plus Jakarta Sans', sans-serif";
            const textWidth = ctx.measureText(text).width;
            const bw = textWidth + 28; 
            const bh = 32;
            const bx = x - bw / 2; 
            const by = y - 65;

            // Efek Glow saat Hover
            if (isHovered) {
                ctx.shadowColor = "#58a6ff";
                ctx.shadowBlur = 12;
            }

            // Bubble Background
            ctx.beginPath(); 
            ctx.roundRect(bx, by, bw, bh, 10); 
            ctx.fillStyle = "#161b22"; 
            ctx.fill(); 
            ctx.strokeStyle = isHovered ? "#58a6ff" : "#30363d"; 
            ctx.lineWidth = 1.5;
            ctx.stroke();
            ctx.shadowBlur = 0; // Reset Shadow

            // Panah Kecil Dibawah Bubble
            ctx.beginPath();
            ctx.moveTo(x - 5, by + bh);
            ctx.lineTo(x, by + bh + 6);
            ctx.lineTo(x + 5, by + bh);
            ctx.fillStyle = "#161b22";
            ctx.fill();

            // Status Dot di Bubble
            ctx.beginPath(); 
            ctx.arc(bx + 14, by + 16, 3.5, 0, Math.PI * 2); 
            ctx.fillStyle = "#3fb950"; 
            ctx.fill();

            // Text
            ctx.fillStyle = "#f0f6fc"; 
            ctx.textAlign = "left"; 
            ctx.fillText(text, bx + 24, by + 20);
        }

        // --- DATA KARYAWAN INTERAKTIF ---
        const employees = [
            { 
                x: 230, y: 220, color: "#3fb950", type: "blob", 
                texts: ["Cek TVL & volume", "Solana DEX memompa!", "Swap 50 SOL -> USDC"], 
                textIdx: 0 
            },
            { 
                x: 570, y: 220, color: "#d29922", type: "robot", 
                texts: ["Beli CBUCKS!", "Membuat Bot Arbitrase", "Server stabil 99.9%"], 
                textIdx: 0 
            },
            { 
                x: 170, y: 380, color: "#58a6ff", type: "alien", 
                texts: ["Lolos 2 pool audit.", "Signal Buy terdeteksi", "Gas fee sangat murah"], 
                textIdx: 0 
            },
            { 
                x: 430, y: 380, color: "#f85149", type: "cat", 
                texts: ["Fee belum diklaim!", "Napping sambil Staking", "Meow! Profit +20%"], 
                textIdx: 0 
            },
            { 
                x: 310, y: 530, color: "#a371f7", type: "alien", 
                texts: ["Radar temukan 40 token", "Airdrop terkonfirmasi!", "Analisis Wyckoff Phase C"], 
                textIdx: 0 
            },
            { 
                x: 630, y: 530, color: "#db61a2", type: "blob", 
                texts: ["Laporan terkirim ke Telegram", "Auto-compound aktif", "Siap untuk Bullrun!"], 
                textIdx: 0 
            }
        ];

        let hoveredEmp = null;
        let offset = 0;

        // --- MAIN ANIMATION LOOP ---
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawParticles();
            offset += 0.04;

            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2 + 30;

            // --- 1. GAMBAR DINDING (ISOMETRIC WALLS) ---
            // Dinding Kiri
            ctx.beginPath(); 
            ctx.moveTo(centerX, centerY - 280); 
            ctx.lineTo(centerX - 420, centerY + 10); 
            ctx.lineTo(centerX - 420, centerY - 180); 
            ctx.lineTo(centerX, centerY - 470); 
            ctx.closePath();
            ctx.fillStyle = "#1f242d"; ctx.fill(); 
            ctx.strokeStyle = "#30363d"; ctx.lineWidth = 1; ctx.stroke();

            // Dinding Kanan
            ctx.beginPath(); 
            ctx.moveTo(centerX, centerY - 280); 
            ctx.lineTo(centerX + 420, centerY + 10); 
            ctx.lineTo(centerX + 420, centerY - 180); 
            ctx.lineTo(centerX, centerY - 470); 
            ctx.closePath();
            ctx.fillStyle = "#161b22"; ctx.fill(); 
            ctx.strokeStyle = "#30363d"; ctx.stroke();

            // Jendela Futuristic / Screen Neon Kiri
            ctx.beginPath(); 
            ctx.moveTo(centerX - 310, centerY - 220); 
            ctx.lineTo(centerX - 130, centerY - 130); 
            ctx.lineTo(centerX - 130, centerY - 230); 
            ctx.lineTo(centerX - 310, centerY - 320); 
            ctx.closePath();
            ctx.fillStyle = "rgba(88, 166, 255, 0.08)"; ctx.fill(); 
            ctx.strokeStyle = "rgba(88, 166, 255, 0.4)"; ctx.lineWidth = 1.5; ctx.stroke();

            // --- 2. GAMBAR LANTAI (ISOMETRIC FLOOR & GRID) ---
            ctx.beginPath(); 
            ctx.moveTo(centerX, centerY - 280); 
            ctx.lineTo(centerX + 420, centerY + 10); 
            ctx.lineTo(centerX, centerY + 300); 
            ctx.lineTo(centerX - 420, centerY + 10); 
            ctx.closePath(); 
            ctx.fillStyle = "#0d1117"; ctx.fill(); 
            ctx.strokeStyle = "#30363d"; ctx.stroke();

            // Isometric Floor Grid Lines
            ctx.strokeStyle = "rgba(255, 255, 255, 0.03)";
            ctx.lineWidth = 1;
            for (let i = -400; i <= 400; i += 40) {
                ctx.beginPath(); 
                ctx.moveTo(centerX + i, centerY + 10 - Math.abs(i) * 0.5); 
                ctx.lineTo(centerX, centerY + 300 - (400 - i) * 0.35); 
                ctx.stroke();
            }

            // Karpet Neon Tengah
            ctx.beginPath();
            ctx.moveTo(centerX, centerY - 80);
            ctx.lineTo(centerX + 200, centerY + 20);
            ctx.lineTo(centerX, centerY + 120);
            ctx.lineTo(centerX - 200, centerY + 20);
            ctx.closePath();
            ctx.fillStyle = "rgba(88, 166, 255, 0.03)"; ctx.fill();
            ctx.strokeStyle = "rgba(88, 166, 255, 0.2)"; ctx.stroke();

            // --- 3. GAMBAR KARAKTER & MEJA (DEPTH SORTING) ---
            // Urutkan berdasarkan koordinat Y agar yang depan menutupi yang belakang secara natural
            employees.sort((a, b) => a.y - b.y);

            employees.forEach((emp, index) => {
                const px = centerX + (emp.x - 400) * 1.15;
                const py = centerY + (emp.y - 380) * 1.15;
                const floatY = Math.sin(offset + index * 1.5) * 4;
                const isHovered = (hoveredEmp === emp);

                // Meja Kerja Isometrik (Sleek Dark Desk)
                drawIsometricBox(px, py + 18, 38, 14, 12, "#21262d", "#161b22", "#30363d");
                
                // Laptop / Display Neon di Atas Meja
                ctx.beginPath();
                ctx.roundRect(px - 10, py + 8, 20, 10, 2);
                ctx.fillStyle = isHovered ? "#58a6ff" : "#2ea043";
                ctx.shadowColor = ctx.fillStyle;
                ctx.shadowBlur = 6;
                ctx.fill();
                ctx.shadowBlur = 0; // Reset

                // Render Karakter Berdasarkan Type
                if (emp.type === "alien") drawAlien(px, py + floatY, emp.color);
                else if (emp.type === "robot") drawRobot(px, py + floatY, emp.color);
                else if (emp.type === "blob") drawBlob(px, py + floatY, emp.color);
                else if (emp.type === "cat") drawCat(px, py + floatY, emp.color);
                
                // Render Chat Bubble
                const currentText = emp.texts[emp.textIdx];
                drawBubble(px, py + floatY, currentText, isHovered);

                // Simpan koordinat render untuk deteksi Klik/Hover Mouse
                emp.renderX = px;
                emp.renderY = py + floatY;
            });

            requestAnimationFrame(animate);
        }

        // --- FITUR INTERAKTIF MOUSE ---
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            hoveredEmp = employees.find(emp => {
                const dist = Math.hypot(mouseX - emp.renderX, mouseY - (emp.renderY - 15));
                return dist < 35;
            });
        });

        canvas.addEventListener('click', () => {
            if (hoveredEmp) {
                // Berganti teks saat diklik
                hoveredEmp.textIdx = (hoveredEmp.textIdx + 1) % hoveredEmp.texts.length;
            }
        });

        // Jalankan Animasi
        animate();
    </script>
</body>
</html>
