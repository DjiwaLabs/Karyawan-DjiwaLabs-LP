<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DJIWA Labs - 3D Isometric Office</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #2b2b36; /* Warna latar belakang gelap */
            font-family: 'Poppins', sans-serif;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Papan Kinerja */
        .dashboard {
            width: 90%;
            max-width: 900px;
            background-color: rgba(22, 27, 34, 0.9);
            border-radius: 15px;
            padding: 15px 30px;
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #30363d;
            z-index: 100;
        }
        .dashboard h2 { margin: 0; font-size: 18px; letter-spacing: 2px; color: #58a6ff; }
        .stats { display: flex; gap: 20px; }
        .stat { text-align: right; }
        .stat span { display: block; font-size: 11px; color: #8b949e; margin-bottom: 2px; }
        .stat strong { font-size: 18px; color: #3fb950; }

        /* Kontainer Isometrik */
        .isometric-container {
            position: relative;
            width: 100%;
            height: 600px;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1200px;
        }

        /* Ruangan Isometrik */
        .room {
            position: relative;
            width: 400px;
            height: 400px;
            transform: rotateX(60deg) rotateZ(-45deg);
            transform-style: preserve-3d;
            background-color: #6a6a8e; /* Warna lantai */
            border-radius: 20px;
            box-shadow: 0 50px 100px rgba(0,0,0,0.8), inset 0 0 100px rgba(0,0,0,0.2);
        }

        /* Dinding Belakang */
        .wall-back {
            position: absolute;
            width: 400px;
            height: 150px;
            background-color: #8585a8;
            bottom: 100%;
            left: 0;
            transform-origin: bottom;
            transform: rotateX(-90deg);
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
            padding-bottom: 20px;
            box-sizing: border-box;
        }
        .wall-left {
            position: absolute;
            width: 150px;
            height: 400px;
            background-color: #7a7a9e;
            top: 0;
            right: 100%;
            transform-origin: right;
            transform: rotateY(90deg);
            border-top-left-radius: 20px;
            border-bottom-left-radius: 20px;
        }

        /* Jendela di Dinding */
        .window {
            width: 120px;
            height: 100px;
            background: linear-gradient(135deg, #a2c2e8, #e0eafc);
            border-radius: 10px;
            border: 4px solid #5a5a7a;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.2);
        }

        /* Meja Kerja */
        .desk {
            position: absolute;
            width: 80px;
            height: 80px;
            background-color: #f0f0f0;
            border-radius: 10px;
            box-shadow: 10px 10px 0px #d0d0d0;
            transform: translateZ(20px);
        }
        .desk::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 20px;
            background-color: #cccccc;
            top: 100%;
            left: 0;
            transform-origin: top;
            transform: rotateX(-90deg);
        }

        /* Posisi Meja */
        .desk-1 { top: 50px; left: 50px; }
        .desk-2 { top: 50px; right: 50px; }
        .desk-3 { bottom: 50px; left: 50px; }
        .desk-4 { bottom: 50px; right: 50px; }
        .desk-5 { top: 160px; left: 160px; transform: translateZ(40px); } /* Meja Pande */
        .desk-6 { bottom: 150px; right: 160px; transform: translateZ(60px); } /* Meja Ompu */

        /* Layar Monitor */
        .monitor {
            position: absolute;
            width: 40px;
            height: 30px;
            background-color: #2b2b36;
            border-radius: 5px;
            top: 10px;
            left: 20px;
            border: 2px solid #444;
            animation: screenGlow 2s infinite alternate;
        }
        .screen-content {
            width: 100%;
            height: 100%;
            background-color: #00ffff;
            opacity: 0.3;
            border-radius: 3px;
        }

        /* Karakter (Kapsul Lucu) */
        .character {
            position: absolute;
            width: 40px;
            height: 50px;
            border-radius: 20px;
            bottom: 20px;
            left: 20px;
            transform: translateZ(30px);
            animation: floatChar 3s ease-in-out infinite;
            box-shadow: inset -5px -5px 15px rgba(0,0,0,0.3);
        }
        
        .char-1 { background: radial-gradient(circle at 30% 30%, #ff7675, #d63031); }
        .char-2 { background: radial-gradient(circle at 30% 30%, #fdcb6e, #e17055); }
        .char-3 { background: radial-gradient(circle at 30% 30%, #74b9ff, #0984e3); }
        .char-4 { background: radial-gradient(circle at 30% 30%, #a29bfe, #6c5ce7); }
        .char-5 { background: radial-gradient(circle at 30% 30%, #55efc4, #00b894); }
        .char-6 { background: radial-gradient(circle at 30% 30%, #fab1a0, #e17055); }

        /* Masker Kaca Karakter */
        .character::after {
            content: '';
            position: absolute;
            width: 30px;
            height: 15px;
            background: rgba(255,255,255,0.4);
            border-radius: 10px;
            top: 10px;
            left: 5px;
        }

        /* Efek Bayangan Karakter */
        .shadow {
            position: absolute;
            width: 40px;
            height: 40px;
            background-color: rgba(0,0,0,0.3);
            border-radius: 50%;
            bottom: -10px;
            left: 0;
            transform: translateZ(1px) rotateX(90deg);
        }

        /* Bubble Chat */
        .bubble {
            position: absolute;
            background: #2d3436;
            color: white;
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            white-space: nowrap;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
            border: 1px solid #444;
            transform: translateZ(100px) rotateZ(45deg) rotateX(-60deg); /* Membalikkan rotasi agar teks tegak */
            animation: popBubble 0.5s ease-out, floatBubble 3s ease-in-out infinite;
        }
        
        /* Titik Biru di Bubble */
        .bubble::before {
            content: '●';
            color: #00cec9;
            margin-right: 5px;
            font-size: 14px;
        }

        /* Animasi */
        @keyframes screenGlow {
            0% { box-shadow: 0 0 5px #00ffff; opacity: 0.8; }
            100% { box-shadow: 0 0 15px #00ffff; opacity: 1; }
        }

        @keyframes floatChar {
            0% { transform: translateZ(30px) translateY(0); }
            50% { transform: translateZ(30px) translateY(-5px); }
            100% { transform: translateZ(30px) translateY(0); }
        }

        @keyframes floatBubble {
            0% { transform: translateZ(100px) rotateZ(45deg) rotateX(-60deg) translateY(0); }
            50% { transform: translateZ(100px) rotateZ(45deg) rotateX(-60deg) translateY(-8px); }
            100% { transform: translateZ(100px) rotateZ(45deg) rotateX(-60deg) translateY(0); }
        }

        @keyframes popBubble {
            0% { opacity: 0; transform: translateZ(100px) rotateZ(45deg) rotateX(-60deg) scale(0.5); }
            100% { opacity: 1; transform: translateZ(100px) rotateZ(45deg) rotateX(-60deg) scale(1); }
        }
    </style>
</head>
<body>

    <!-- Papan Kinerja -->
    <div class="dashboard">
        <h2>DJIWA LABS</h2>
        <div class="stats">
            <div class="stat"><span>PnL Total</span><strong id="pnl-total">+$18,374</strong></div>
            <div class="stat"><span>Posisi</span><strong id="posisi-terbuka">5/5</strong></div>
            <div class="stat"><span>Saldo Web3</span><strong id="saldo-devnet">20.00 SOL</strong></div>
        </div>
    </div>

    <!-- Ruangan 3D -->
    <div class="isometric-container">
        <div class="room">
            <!-- Dinding -->
            <div class="wall-back">
                <div class="window"></div>
                <div class="window"></div>
            </div>
            <div class="wall-left"></div>

            <!-- Meja 1: Siboru -->
            <div class="desk desk-1">
                <div class="monitor"><div class="screen-content"></div></div>
                <div class="character char-1"><div class="shadow"></div></div>
                <div class="bubble">Radar temukan 40 token!</div>
            </div>

            <!-- Meja 2: Parhata -->
            <div class="desk desk-2">
                <div class="monitor"><div class="screen-content"></div></div>
                <div class="character char-3"><div class="shadow"></div></div>
                <div class="bubble" style="top: -40px; left: -50px;">Lolos 2 pool.</div>
            </div>

            <!-- Meja 3: Raja -->
            <div class="desk desk-3">
                <div class="monitor"><div class="screen-content"></div></div>
                <div class="character char-2"><div class="shadow"></div></div>
                <div class="bubble" style="top: 20px; left: 50px;">Beli CBUCKS!</div>
            </div>

            <!-- Meja 4: Panongani -->
            <div class="desk desk-4">
                <div class="monitor"><div class="screen-content"></div></div>
                <div class="character char-4"><div class="shadow"></div></div>
                <div class="bubble" style="top: -30px; left: -20px;">Laporan terkirim!</div>
            </div>

            <!-- Meja 5: Pande Harta (Tengah) -->
            <div class="desk desk-5">
                <div class="monitor"><div class="screen-content"></div></div>
                <div class="character char-5"><div class="shadow"></div></div>
                <div class="bubble" style="top: -40px; left: 30px;">Cek TVL & Volume</div>
            </div>

            <!-- Meja 6: Ompu Etika (Tengah) -->
            <div class="desk desk-6">
                <div class="monitor"><div class="screen-content"></div></div>
                <div class="character char-6"><div class="shadow"></div></div>
                <div class="bubble" style="top: 30px; left: -80px;">Fee $0.86 belum diklaim</div>
            </div>

        </div>
    </div>

</body>
</html>
