<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DJIWA LABS - Isometric Web3 Office</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap');
        
        * {
            box-sizing: border-box;
            user-select: none;
        }

        body { 
            margin: 0; 
            padding: 0; 
            background: #110d1a; 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            overflow: hidden; 
            color: white; 
            height: 100vh;
        }
        
        .dashboard { 
            width: 92%; 
            max-width: 950px; 
            background: rgba(28, 20, 48, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 16px; 
            padding: 12px 24px; 
            margin-top: 15px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
            border: 1px solid rgba(162, 138, 214, 0.2); 
            z-index: 10; 
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background-color: #3fb950;
            border-radius: 50%;
            box-shadow: 0 0 10px #3fb950;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(63, 185, 80, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(63, 185, 80, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(63, 185, 80, 0); }
        }

        .dashboard h2 { 
            margin: 0; 
            font-size: 18px; 
            font-weight: 800;
            background: linear-gradient(135deg, #d2bcf3 0%, #a78bfa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }

        .stats { 
            display: flex; 
            gap: 20px; 
        }

        .stat {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .stat span { 
            font-size: 10px; 
            color: #9d8ec2; 
            font-weight: 700;
            text-transform: uppercase;
        }

        .stat strong { 
            font-size: 15px; 
            color: #4ade80; 
            font-weight: 700;
        }

        .badge {
            background: rgba(74, 222, 128, 0.15);
            padding: 2px 8px;
            border-radius: 6px;
            border: 1px solid rgba(74, 222, 128, 0.3);
        }

        canvas { 
            display: block; 
            cursor: pointer;
        }

        .instructions {
            position: absolute;
            bottom: 15px;
            font-size: 12px;
            color: #bfa8e6;
            background: rgba(26, 18, 43, 0.8);
            padding: 6px 16px;
            border-radius: 20px;
            border: 1px solid rgba(167, 139, 250, 0.3);
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="dashboard">
        <div class="brand">
            <div class="status-dot"></div>
            <h2>DJIWA LABS</h2>
        </div>
        <div class="stats">
            <div class="stat"><span>PnL Total</span><strong class="badge">+$18,374.56</strong></div>
            <div class="stat"><span>Posisi Aktif</span><strong>5 / 5</strong></div>
            <div class="stat"><span>Saldo Web3</span><strong style="color:#a78bfa;">20.00 SOL</strong></div>
        </div>
    </div>

    <canvas id="officeCanvas"></canvas>
    <div class="instructions">💡 Klik karakter robot untuk mengganti aktivitas & pesan mereka</div>

    <script>
        const canvas = document.getElementById('officeCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight - 70;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // --- DEKORASI BACKGROUND PARTIKEL ---
        const particles = Array.from({ length: 25 }, () => ({
            x: Math.random() * window.innerWidth,
            y: Math.random() * window.innerHeight,
            size: Math.random() * 2 + 1,
            speedY: Math.random() * 0.3 + 0.1,
            opacity: Math.random() * 0.4 + 0.1
        }));

        function drawParticles() {
            particles.forEach(p => {
                p.y -= p.speedY;
                if (p.y < 0) p.y = canvas.height;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(167, 139, 250, ${p.opacity})`;
                ctx.fill();
            });
        }

        // --- ISOMETRIC HELPER FUNCTIONS ---
        function toIso(x, y, z = 0, originX = canvas.width / 2, originY = canvas.height / 2 + 20) {
            const isoX = originX + (x - y) * 1.5;
            const isoY = originY + (x + y) * 0.75 - z;
            return { x: isoX, y: isoY };
        }

        function drawIsoTile(gx, gy, size, colorTop, colorLeft, colorRight, originX, originY) {
            const p1 = toIso(gx * size, gy * size, 0, originX, originY);
            const p2 = toIso((gx + 1) * size, gy * size, 0, originX, originY);
            const p3 = toIso((gx + 1) * size, (gy + 1) * size, 0, originX, originY);
            const p4 = toIso(gx * size, (gy + 1) * size, 0, originX, originY);

            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.lineTo(p3.x, p3.y);
            ctx.lineTo(p4.x, p4.y);
            ctx.closePath();
            ctx.fillStyle = colorTop;
            ctx.fill();
            ctx.strokeStyle = "rgba(167, 139, 250, 0.12)";
            ctx.lineWidth = 1;
            ctx.stroke();
        }

        // --- GAMBAR MEJA & SEAT KANTOR ---
        function drawWorkstation(gx, gy, size, originX, originY, label, colorAccent, isHovered) {
            const basePos = toIso((gx + 0.5) * size, (gy + 0.5) * size, 0, originX, originY);
            
            // Bayangan Meja
            ctx.beginPath();
            ctx.ellipse(basePos.x, basePos.y + 10, 45, 20, 0, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(0,0,0,0.3)";
            ctx.fill();

            // Meja Putih Minimalis
            const deskW = 32, deskH = 20, deskHeight = 22;
            const deskTop = toIso((gx + 0.1) * size, (gy + 0.1) * size, deskHeight, originX, originY);
            const deskRight = toIso((gx + 0.9) * size, (gy + 0.1) * size, deskHeight, originX, originY);
            const deskBottom = toIso((gx + 0.9) * size, (gy + 0.9) * size, deskHeight, originX, originY);
            const deskLeft = toIso((gx + 0.1) * size, (gy + 0.9) * size, deskHeight, originX, originY);

            // Sisi Meja
            ctx.beginPath();
            ctx.moveTo(deskLeft.x, deskLeft.y);
            ctx.lineTo(deskBottom.x, deskBottom.y);
            ctx.lineTo(deskBottom.x, deskBottom.y + deskHeight);
            ctx.lineTo(deskLeft.x, deskLeft.y + deskHeight);
            ctx.closePath();
            ctx.fillStyle = "#cbd5e1"; ctx.fill();

            ctx.beginPath();
            ctx.moveTo(deskBottom.x, deskBottom.y);
            ctx.lineTo(deskRight.x, deskRight.y);
            ctx.lineTo(deskRight.x, deskRight.y + deskHeight);
            ctx.lineTo(deskBottom.x, deskBottom.y + deskHeight);
            ctx.closePath();
            ctx.fillStyle = "#94a3b8"; ctx.fill();

            // Atas Meja (Putih)
            ctx.beginPath();
            ctx.moveTo(deskTop.x, deskTop.y);
            ctx.lineTo(deskRight.x, deskRight.y);
            ctx.lineTo(deskBottom.x, deskBottom.y);
            ctx.lineTo(deskLeft.x, deskLeft.y);
            ctx.closePath();
            ctx.fillStyle = "#f8fafc"; ctx.fill();

            // Monitor Komputer
            const monPos = toIso((gx + 0.35) * size, (gy + 0.35) * size, deskHeight + 2, originX, originY);
            ctx.beginPath();
            ctx.roundRect(monPos.x - 14, monPos.y - 18, 28, 16, 3);
            ctx.fillStyle = "#0f172a"; ctx.fill();
            ctx.strokeStyle = isHovered ? colorAccent : "#3b82f6";
            ctx.lineWidth = 1.5; ctx.stroke();

            // Screen Display Chart
            ctx.beginPath();
            ctx.roundRect(monPos.x - 12, monPos.y - 16, 24, 12, 2);
            ctx.fillStyle = "#1e1b4b"; ctx.fill();

            // Candlestick Grafis Mini
            ctx.fillStyle = "#22c55e"; ctx.fillRect(monPos.x - 8, monPos.y - 12, 3, 6);
            ctx.fillStyle = "#ef4444"; ctx.fillRect(monPos.x - 3, monPos.y - 14, 3, 8);
            ctx.fillStyle = "#22c55e"; ctx.fillRect(monPos.x + 2, monPos.y - 10, 3, 5);

            // Label Nama Role di Depan Meja
            ctx.font = "700 10px 'Plus Jakarta Sans', sans-serif";
            ctx.fillStyle = "#64748b";
            ctx.textAlign = "center";
            ctx.fillText(label, basePos.x, basePos.y + 24);
        }

        // --- GAMBAR ROBOT HELMET (CYBORG) ---
        function drawCyborgRobot(x, y, color, floatOffset, isHovered) {
            const py = y + floatOffset;

            // Bayangan Robot
            ctx.beginPath();
            ctx.ellipse(x, y + 10, 16, 7, 0, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(0,0,0,0.35)";
            ctx.fill();

            if (isHovered) {
                ctx.shadowColor = color;
                ctx.shadowBlur = 15;
            }

            // Badan Robot
            ctx.beginPath();
            ctx.ellipse(x, py - 12, 14, 12, 0, 0, Math.PI * 2);
            ctx.fillStyle = "#334155";
            ctx.fill();

            // Helm Bulat Utama
            ctx.beginPath();
            ctx.arc(x, py - 28, 16, 0, Math.PI * 2);
            ctx.fillStyle = color;
            ctx.fill();
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 2;
            ctx.stroke();

            // Visor Hitam
            ctx.beginPath();
            ctx.roundRect(x - 10, py - 32, 20, 10, 5);
            ctx.fillStyle = "#0f172a";
            ctx.fill();

            // Mata Digital Glow Magenta
            ctx.beginPath();
            ctx.arc(x - 4, py - 27, 2, 0, Math.PI * 2);
            ctx.arc(x + 4, py - 27, 2, 0, Math.PI * 2);
            ctx.fillStyle = "#ec4899";
            ctx.fill();

            // Telinga Headset
            ctx.beginPath();
            ctx.arc(x - 16, py - 28, 3, 0, Math.PI * 2);
            ctx.arc(x + 16, py - 28, 3, 0, Math.PI * 2);
            ctx.fillStyle = "#f43f5e";
            ctx.fill();

            ctx.shadowBlur = 0; // Reset
        }

        // --- BUBBLE CHAT STYLED ---
        function drawBubble(x, y, text, badgeColor, isHovered) {
            ctx.font = "700 11px 'Plus Jakarta Sans', sans-serif";
            const textWidth = ctx.measureText(text).width;
            const bw = textWidth + 30;
            const bh = 30;
            const bx = x - bw / 2;
            const by = y - 72;

            if (isHovered) {
                ctx.shadowColor = badgeColor;
                ctx.shadowBlur = 12;
            }

            // Body Bubble
            ctx.beginPath();
            ctx.roundRect(bx, by, bw, bh, 15);
            ctx.fillStyle = "#1e1b4b";
            ctx.fill();
            ctx.strokeStyle = badgeColor;
            ctx.lineWidth = 1.5;
            ctx.stroke();
            ctx.shadowBlur = 0;

            // Panah Bubble
            ctx.beginPath();
            ctx.moveTo(x - 4, by + bh);
            ctx.lineTo(x, by + bh + 5);
            ctx.lineTo(x + 4, by + bh);
            ctx.fillStyle = "#1e1b4b";
            ctx.fill();

            // Indicator Dot
            ctx.beginPath();
            ctx.arc(bx + 12, by + 15, 3.5, 0, Math.PI * 2);
            ctx.fillStyle = badgeColor;
            ctx.fill();

            // Text
            ctx.fillStyle = "#ffffff";
            ctx.textAlign = "left";
            ctx.fillText(text, bx + 22, by + 19);
        }

        // --- DEKORASI RAK BUKU & BINGKAI DINDING ---
        function drawDecorations(originX, originY) {
            // Bingkai Chart 1 (Dinding Kiri)
            const f1 = toIso(0, 1.5, 90, originX, originY);
            ctx.beginPath(); ctx.roundRect(f1.x - 35, f1.y - 15, 30, 20, 3); ctx.fillStyle = "#2e1065"; ctx.fill(); ctx.strokeStyle = "#a78bfa"; ctx.stroke();
            ctx.fillStyle = "#4ade80"; ctx.fillRect(f1.x - 30, f1.y - 8, 4, 10);
            ctx.fillStyle = "#f43f5e"; ctx.fillRect(f1.x - 24, f1.y - 12, 4, 12);
            ctx.fillStyle = "#4ade80"; ctx.fillRect(f1.x - 18, f1.y - 6, 4, 8);

            // Bingkai Chart 2 (Dinding Kanan)
            const f2 = toIso(2.5, 0, 95, originX, originY);
            ctx.beginPath(); ctx.roundRect(f2.x + 5, f2.y - 15, 35, 20, 3); ctx.fillStyle = "#2e1065"; ctx.fill(); ctx.strokeStyle = "#38bdf8"; ctx.stroke();
            ctx.fillStyle = "#38bdf8"; ctx.fillRect(f2.x + 10, f2.y - 10, 5, 12);
            ctx.fillStyle = "#4ade80"; ctx.fillRect(f2.x + 18, f2.y - 12, 5, 14);

            // Jam Dinding Bulat (Dinding Kanan)
            const clockPos = toIso(4.2, 0, 100, originX, originY);
            ctx.beginPath(); ctx.arc(clockPos.x + 10, clockPos.y - 10, 10, 0, Math.PI * 2); ctx.fillStyle = "#ffffff"; ctx.fill(); ctx.strokeStyle = "#64748b"; ctx.lineWidth = 2; ctx.stroke();
            ctx.beginPath(); ctx.moveTo(clockPos.x + 10, clockPos.y - 10); ctx.lineTo(clockPos.x + 10, clockPos.y - 16); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(clockPos.x + 10, clockPos.y - 10); ctx.lineTo(clockPos.x + 15, clockPos.y - 10); ctx.stroke();

            // Plang Kantor "DJIWA HQ"
            const signPos = toIso(5.2, 0, 105, originX, originY);
            ctx.beginPath(); ctx.roundRect(signPos.x + 5, signPos.y - 18, 60, 22, 4); ctx.fillStyle = "rgba(15, 23, 42, 0.8)"; ctx.fill(); ctx.strokeStyle = "#a78bfa"; ctx.stroke();
            ctx.font = "800 9px 'Plus Jakarta Sans', sans-serif"; ctx.fillStyle = "#ffffff"; ctx.textAlign = "center";
            ctx.fillText("DJIWA HQ", signPos.x + 35, signPos.y - 8);
            ctx.font = "600 7px 'Plus Jakarta Sans', sans-serif"; ctx.fillStyle = "#94a3b8";
            ctx.fillText("Digital Workforce", signPos.x + 35, signPos.y - 1);
        }

        // --- DATA KARYAWAN ROBOT ---
        const employees = [
            { 
                gx: 1.2, gy: 1.2, label: "Rara - Riset Pool", color: "#fbbf24", badgeColor: "#f59e0b",
                texts: ["Cek TVL & volume", "Liquidity Pool +18%", "Volume SOL naik 25%"], textIdx: 0 
            },
            { 
                gx: 3.8, gy: 1.2, label: "Bima - Manager", color: "#38bdf8", badgeColor: "#0284c7",
                texts: ["Fee $0.86 belum diklaim", "Staking APY 14.2%", "Rebalancing Portfolio"], textIdx: 0 
            },
            { 
                gx: 1.2, gy: 3.5, label: "Rala - Eksekutor", color: "#4ade80", badgeColor: "#16a34a",
                texts: ["PnL +$0.34", "Order Buy terpasang", "Gas fee optimal"], textIdx: 0 
            },
            { 
                gx: 3.8, gy: 3.5, label: "Fathata - Validator", color: "#c084fc", badgeColor: "#9333ea",
                texts: ["Lolos 2 pool audit", "Smart contract safe", "Signatures valid!"], textIdx: 0 
            },
            { 
                gx: 2.5, gy: 5.2, label: "Pandangan - Reporter", color: "#f43f5e", badgeColor: "#e11d48",
                texts: ["Laporan terkirim!", "Notifikasi Telegram ON", "Daily summary ready"], textIdx: 0 
            }
        ];

        let hoveredEmp = null;
        let offset = 0;

        // --- MAIN LOOP ANIMATOR ---
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawParticles();
            offset += 0.04;

            const originX = canvas.width / 2;
            const originY = canvas.height / 2 - 20;
            const tileSize = 60;
            const gridSize = 6;

            // --- 1. GAMBAR DINDING LAVENDER ---
            // Dinding Kiri
            const wallLeftTop = toIso(0, 0, 140, originX, originY);
            const wallLeftBot = toIso(0, 0, 0, originX, originY);
            const wallLeftEnd = toIso(0, gridSize, 0, originX, originY);
            const wallLeftEndTop = toIso(0, gridSize, 140, originX, originY);

            ctx.beginPath();
            ctx.moveTo(wallLeftBot.x, wallLeftBot.y);
            ctx.lineTo(wallLeftEnd.x, wallLeftEnd.y);
            ctx.lineTo(wallLeftEndTop.x, wallLeftEndTop.y);
            ctx.lineTo(wallLeftTop.x, wallLeftTop.y);
            ctx.closePath();
            ctx.fillStyle = "#8b78a5"; ctx.fill();
            ctx.strokeStyle = "#766390"; ctx.stroke();

            // Dinding Kanan
            const wallRightEnd = toIso(gridSize, 0, 0, originX, originY);
            const wallRightEndTop = toIso(gridSize, 0, 140, originX, originY);

            ctx.beginPath();
            ctx.moveTo(wallLeftBot.x, wallLeftBot.y);
            ctx.lineTo(wallRightEnd.x, wallRightEnd.y);
            ctx.lineTo(wallRightEndTop.x, wallRightEndTop.y);
            ctx.lineTo(wallLeftTop.x, wallLeftTop.y);
            ctx.closePath();
            ctx.fillStyle = "#9c87ba"; ctx.fill();
            ctx.strokeStyle = "#8973a8"; ctx.stroke();

            // Render Dekorasi Dinding
            drawDecorations(originX, originY);

            // --- 2. GAMBAR LANTAI PURPLE CHECKERBOARD ---
            for (let gx = 0; gx < gridSize; gx++) {
                for (let gy = 0; gy < gridSize; gy++) {
                    const isEven = (gx + gy) % 2 === 0;
                    const tileColor = isEven ? "#5c4a78" : "#4e3d69";
                    drawIsoTile(gx, gy, tileSize, tileColor, "#3d2d57", "#322349", originX, originY);
                }
            }

            // Karpet Tengah "DJIWA LABS"
            const rugPos = toIso(3, 3, 1, originX, originY);
            ctx.font = "800 11px 'Plus Jakarta Sans', sans-serif";
            ctx.fillStyle = "rgba(255, 255, 255, 0.15)";
            ctx.textAlign = "center";
            ctx.fillText("DJIWA LABS WORKFORCE", rugPos.x, rugPos.y);

            // --- 3. RENDERING KARYAWAN & MEJA (DEPTH SORTED) ---
            employees.sort((a, b) => (a.gx + a.gy) - (b.gx + b.gy));

            employees.forEach((emp, idx) => {
                const isHovered = (hoveredEmp === emp);
                const floatOffset = Math.sin(offset + idx * 1.5) * 4;

                // Render Meja & Kursi
                drawWorkstation(emp.gx, emp.gy, tileSize, originX, originY, emp.label, emp.badgeColor, isHovered);

                // Koordinat Robot di Belakang Meja
                const robotPos = toIso((emp.gx + 0.5) * tileSize, (emp.gy + 0.3) * tileSize, 22, originX, originY);

                // Render Robot
                drawCyborgRobot(robotPos.x, robotPos.y, emp.color, floatOffset, isHovered);

                // Render Bubble Chat
                const currentText = emp.texts[emp.textIdx];
                drawBubble(robotPos.x, robotPos.y + floatOffset, currentText, emp.badgeColor, isHovered);

                // Simpan koordinat hit-test untuk hover/click
                emp.renderX = robotPos.x;
                emp.renderY = robotPos.y + floatOffset - 15;
            });

            requestAnimationFrame(animate);
        }

        // --- MOUSE INTERACTION ---
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            hoveredEmp = employees.find(emp => {
                const dist = Math.hypot(mouseX - emp.renderX, mouseY - emp.renderY);
                return dist < 35;
            });
        });

        canvas.addEventListener('click', () => {
            if (hoveredEmp) {
                hoveredEmp.textIdx = (hoveredEmp.textIdx + 1) % hoveredEmp.texts.length;
            }
        });

        // Start
        animate();
    </script>
</body>
</html>
