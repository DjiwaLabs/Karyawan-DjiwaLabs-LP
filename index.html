<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DJIWA Labs - 3D Isometric Virtual Office</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        
        * { 
            box-sizing: border-box; 
            user-select: none; 
            margin: 0; 
            padding: 0; 
        }

        body { 
            background: #090714; 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: flex-start; 
            overflow: hidden; 
            color: #ffffff; 
            height: 100vh; 
            width: 100vw; 
        }

        /* Top Dashboard Glassmorphic Header */
        .dashboard { 
            width: 92%; 
            max-width: 1040px; 
            background: rgba(22, 17, 41, 0.8); 
            backdrop-filter: blur(16px); 
            -webkit-backdrop-filter: blur(16px); 
            border-radius: 20px; 
            padding: 12px 26px; 
            margin-top: 14px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6), inset 0 1px 1px rgba(255, 255, 255, 0.15); 
            border: 1px solid rgba(167, 139, 250, 0.25); 
            z-index: 10; 
        }

        .brand { 
            display: flex; 
            align-items: center; 
            gap: 14px; 
        }

        .status-dot { 
            width: 12px; 
            height: 12px; 
            background-color: #10b981; 
            border-radius: 50%; 
            box-shadow: 0 0 12px #10b981; 
            animation: pulse 2s infinite; 
        }

        @keyframes pulse { 
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); } 
            70% { transform: scale(1.05); box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); } 
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); } 
        }

        .brand h2 { 
            font-size: 20px; 
            font-weight: 800; 
            background: linear-gradient(135deg, #c084fc 0%, #38bdf8 100%); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
            letter-spacing: 1.5px; 
        }

        .stats { 
            display: flex; 
            gap: 24px; 
        }

        .stat { 
            display: flex; 
            flex-direction: column; 
            align-items: flex-end; 
        }

        .stat span { 
            font-size: 10px; 
            color: #a78bfa; 
            font-weight: 700; 
            text-transform: uppercase; 
            letter-spacing: 0.8px; 
        }

        .stat strong { 
            font-size: 14px; 
            color: #34d399; 
            font-weight: 700; 
        }

        .stat strong.badge { 
            background: rgba(52, 211, 153, 0.12); 
            padding: 3px 12px; 
            border-radius: 8px; 
            border: 1px solid rgba(52, 211, 153, 0.3); 
        }

        canvas { 
            display: block; 
            cursor: default; 
            touch-action: none;
        }

        .instructions { 
            position: absolute; 
            bottom: 16px; 
            font-size: 12px; 
            font-weight: 600;
            color: #d8b4fe; 
            background: rgba(22, 17, 41, 0.9); 
            backdrop-filter: blur(8px);
            padding: 8px 22px; 
            border-radius: 30px; 
            border: 1px solid rgba(167, 139, 250, 0.3); 
            pointer-events: none; 
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4); 
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .instructions span {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #38bdf8;
            border-radius: 50%;
            box-shadow: 0 0 8px #38bdf8;
        }
    </style>
</head>
<body>

    <div class="dashboard">
        <div class="brand">
            <div class="status-dot"></div>
            <h2>DJIWA LABS HQ</h2>
        </div>
        <div class="stats">
            <div class="stat"><span>PnL Total</span><strong class="badge" id="pnl-total">+$18,374.56</strong></div>
            <div class="stat"><span>Posisi Aktif</span><strong id="posisi-terbuka">5 / 5</strong></div>
            <div class="stat"><span>Saldo Web3</span><strong style="color:#38bdf8;" id="saldo-devnet">20.00 SOL</strong></div>
        </div>
    </div>

    <canvas id="officeCanvas"></canvas>
    <div class="instructions"><span></span> Klik robot untuk interaksi / merubah percakapan. Robot dapat berjalan & ngobrol otomatis!</div>

    <script>
        const canvas = document.getElementById('officeCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // --- KONFIGURASI GRID ISOMETRIK ---
        const GRID_ROWS = 9;
        const GRID_COLS = 9;
        const TILE_WIDTH = 58;
        const TILE_HEIGHT = 29;

        function gridToScreen(gx, gy, originX, originY) {
            return {
                x: originX + (gx - gy) * TILE_WIDTH,
                y: originY + (gx + gy) * TILE_HEIGHT
            };
        }

        // Helper Box 3D Isometric
        function drawIsoBox(x, y, w, h, d, colorTop, colorLeft, colorRight) {
            // Sisi Atas
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x + w, y + w * 0.5);
            ctx.lineTo(x, y + w);
            ctx.lineTo(x - w, y + w * 0.5);
            ctx.closePath();
            ctx.fillStyle = colorTop;
            ctx.fill();

            // Sisi Kiri
            ctx.beginPath();
            ctx.moveTo(x - w, y + w * 0.5);
            ctx.lineTo(x, y + w);
            ctx.lineTo(x, y + w + h);
            ctx.lineTo(x - w, y + w * 0.5 + h);
            ctx.closePath();
            ctx.fillStyle = colorLeft;
            ctx.fill();

            // Sisi Kanan
            ctx.beginPath();
            ctx.moveTo(x, y + w);
            ctx.lineTo(x + w, y + w * 0.5);
            ctx.lineTo(x + w, y + w * 0.5 + h);
            ctx.lineTo(x, y + w + h);
            ctx.closePath();
            ctx.fillStyle = colorRight;
            ctx.fill();
        }

        // Draw Server Rack / Mainframe
        function drawServerRack(x, y) {
            drawIsoBox(x, y, 26, 75, 26, "#1e1b4b", "#111827", "#1f2937");
            for (let i = 0; i < 6; i++) {
                const ly = y + 18 + i * 9;
                ctx.fillStyle = i % 2 === 0 ? "#10b981" : "#38bdf8";
                ctx.fillRect(x - 14, ly, 4, 3);
                ctx.fillStyle = "#ef4444";
                ctx.fillRect(x - 8, ly, 4, 3);
                
                ctx.strokeStyle = "rgba(167, 139, 250, 0.4)";
                ctx.beginPath();
                ctx.moveTo(x - 2, ly + 1);
                ctx.lineTo(x + 16, ly - 8);
                ctx.stroke();
            }
        }

        // Draw Breakroom Coffee Station / Lounge Desk
        function drawCoffeeStation(x, y) {
            drawIsoBox(x, y, 32, 22, 32, "#334155", "#1e293b", "#0f172a");
            // Coffee Machine
            drawIsoBox(x - 8, y - 10, 10, 14, 10, "#475569", "#0f172a", "#1e293b");
            ctx.fillStyle = "#38bdf8";
            ctx.fillRect(x - 10, y - 4, 4, 4); // Screen indicator
        }

        // Draw Cyber Plant
        function drawPlant(x, y) {
            drawIsoBox(x, y + 10, 14, 20, 14, "#334155", "#1e293b", "#0f172a");
            ctx.beginPath();
            ctx.arc(x, y - 12, 16, 0, Math.PI * 2);
            ctx.fillStyle = "#059669";
            ctx.fill();
            ctx.beginPath();
            ctx.arc(x - 3, y - 16, 10, 0, Math.PI * 2);
            ctx.fillStyle = "#10b981";
            ctx.fill();
            ctx.beginPath();
            ctx.arc(x + 5, y - 10, 6, 0, Math.PI * 2);
            ctx.fillStyle = "#34d399";
            ctx.fill();
        }

        // Draw Workstation Desk
        function drawDesk(x, y, isOccupied, labelText, monitorState) {
            // Shadow
            ctx.beginPath();
            ctx.ellipse(x, y + 26, 38, 18, 0, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(5, 4, 12, 0.55)";
            ctx.fill();
            
            // Desk Legs
            ctx.fillStyle = "#334155";
            ctx.fillRect(x - 28, y + 15, 4, 18);
            ctx.fillRect(x + 24, y + 15, 4, 18);

            // Desk Surface
            const deskW = 34;
            drawIsoBox(x, y, deskW, 12, deskW, "#f1f5f9", "#94a3b8", "#64748b");

            // Monitor Setup
            const mx = x - 6;
            const my = y - 14;
            ctx.fillStyle = "#475569";
            ctx.fillRect(mx + 4, my + 8, 5, 8);

            ctx.beginPath();
            ctx.roundRect(mx - 10, my - 12, 32, 18, 3);
            ctx.fillStyle = "#0f172a";
            ctx.fill();
            ctx.strokeStyle = "#334155";
            ctx.lineWidth = 1.5;
            ctx.stroke();

            // Monitor Content
            ctx.beginPath();
            ctx.roundRect(mx - 8, my - 10, 28, 14, 2);
            if (monitorState === 0) {
                ctx.fillStyle = "#090d16"; ctx.fill();
                ctx.fillStyle = "#10b981"; ctx.fillRect(mx - 4, my - 6, 3, 9); ctx.fillRect(mx + 4, my - 8, 3, 11);
                ctx.fillStyle = "#ef4444"; ctx.fillRect(mx, my - 2, 3, 7);
            } else if (monitorState === 1) {
                ctx.fillStyle = "#022c22"; ctx.fill();
                ctx.fillStyle = "#34d399"; ctx.fillRect(mx - 6, my - 7, 14, 2); ctx.fillRect(mx - 6, my - 3, 18, 2);
            } else {
                ctx.fillStyle = "#2e1065"; ctx.fill();
                ctx.beginPath(); ctx.arc(mx + 6, my - 3, 4, 0, Math.PI * 2); ctx.strokeStyle = "#c084fc"; ctx.lineWidth = 1.5; ctx.stroke();
            }

            // Keyboard & Mouse Pad
            ctx.fillStyle = "#1e293b"; ctx.fillRect(x - 10, y + 6, 14, 6);
            ctx.fillStyle = "#38bdf8"; ctx.fillRect(x + 7, y + 8, 4, 4);

            // Desk Station Label (Fixed to desk)
            ctx.font = "700 9px 'Plus Jakarta Sans', sans-serif";
            ctx.fillStyle = "rgba(148, 163, 184, 0.7)";
            ctx.textAlign = "center";
            ctx.fillText("STATION " + labelText.split(" ")[0].toUpperCase(), x, y + 36);
        }

        // --- ROBOT CHARACTER RENDERER (WITH DYNAMIC ATTACHED NAME TAG) ---
        function drawCyborgRobot(x, y, color, isHovered, isWalking, facingRight, state, nameLabel) {
            const floatY = y - (state === "WORKING" ? 24 : 32);

            // Shadow
            ctx.beginPath();
            ctx.ellipse(x, y + 5, 12, 6, 0, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(0, 0, 0, 0.45)";
            ctx.fill();

            // Glow Aura
            if (isHovered) {
                ctx.shadowColor = color;
                ctx.shadowBlur = 18;
            }

            // Robot Body (Cyber Armor)
            ctx.beginPath();
            ctx.arc(x, floatY + 12, 12, 0, Math.PI * 2);
            ctx.fillStyle = color;
            ctx.fill();
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 1.5;
            ctx.stroke();

            // Chest Core Light
            ctx.beginPath();
            ctx.arc(x, floatY + 14, 4, 0, Math.PI * 2);
            ctx.fillStyle = "#ffffff";
            ctx.fill();
            ctx.shadowColor = "#ffffff";
            ctx.shadowBlur = 6;
            ctx.fill();
            ctx.shadowBlur = 0;

            // Robot Head
            ctx.beginPath();
            ctx.arc(x, floatY - 2, 10, 0, Math.PI * 2);
            ctx.fillStyle = "#1e1b4b";
            ctx.fill();
            ctx.strokeStyle = color;
            ctx.lineWidth = 2;
            ctx.stroke();

            // Visor / Eyes (Facing Left or Right)
            const visorOffset = facingRight ? 3 : -3;
            ctx.beginPath();
            ctx.roundRect(x + visorOffset - 6, floatY - 6, 12, 6, 3);
            ctx.fillStyle = isHovered ? "#38bdf8" : "#34d399";
            ctx.fill();

            // Antenna
            ctx.beginPath();
            ctx.moveTo(x, floatY - 12);
            ctx.lineTo(x, floatY - 20);
            ctx.strokeStyle = color;
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(x, floatY - 20, 3, 0, Math.PI * 2);
            ctx.fillStyle = state === "CHATTING" ? "#f43f5e" : (state === "WALKING" ? "#38bdf8" : "#10b981");
            ctx.fill();

            // Dynamic Walking Legs Animation
            if (isWalking) {
                const step = Math.sin(Date.now() * 0.015) * 6;
                ctx.strokeStyle = color;
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(x - 4, floatY + 22);
                ctx.lineTo(x - 4 - step, floatY + 28);
                ctx.moveTo(x + 4, floatY + 22);
                ctx.lineTo(x + 4 + step, floatY + 28);
                ctx.stroke();
            }

            ctx.shadowBlur = 0;

            // --- DYNAMIC NAME TAG ATTACHED TO ROBOT ---
            ctx.font = "800 10px 'Plus Jakarta Sans', sans-serif";
            const textWidth = ctx.measureText(nameLabel).width;
            const badgeW = textWidth + 14;
            const badgeH = 18;
            const badgeX = x - badgeW / 2;
            const badgeY = y + 12;

            ctx.beginPath();
            ctx.roundRect(badgeX, badgeY, badgeW, badgeH, 6);
            ctx.fillStyle = "rgba(15, 12, 29, 0.88)";
            ctx.fill();
            ctx.strokeStyle = color;
            ctx.lineWidth = 1;
            ctx.stroke();

            ctx.fillStyle = "#ffffff";
            ctx.textAlign = "center";
            ctx.shadowColor = "rgba(0, 0, 0, 0.9)";
            ctx.shadowBlur = 4;
            ctx.fillText(nameLabel, x, badgeY + 12);
            ctx.shadowBlur = 0;
        }

        // --- CHAT / DIALOG BUBBLE ---
        function drawBubble(x, y, text, isHovered, dotColor, isChatting) {
            ctx.font = "700 11px 'Plus Jakarta Sans', sans-serif";
            const textWidth = ctx.measureText(text).width;
            const bw = textWidth + 34;
            const bh = 30;
            const bx = x - bw / 2;
            const by = y - 84;

            if (isHovered || isChatting) {
                ctx.shadowColor = dotColor;
                ctx.shadowBlur = 12;
            }

            ctx.beginPath();
            ctx.roundRect(bx, by, bw, bh, 14);
            ctx.fillStyle = isChatting ? "rgba(30, 20, 55, 0.95)" : "rgba(15, 12, 29, 0.92)";
            ctx.fill();
            ctx.strokeStyle = isChatting ? "#38bdf8" : (isHovered ? dotColor : "rgba(167, 139, 250, 0.35)");
            ctx.lineWidth = 1.5;
            ctx.stroke();
            ctx.shadowBlur = 0;

            // Indicator Dot
            ctx.beginPath();
            ctx.arc(bx + 14, by + 15, 4, 0, Math.PI * 2);
            ctx.fillStyle = dotColor;
            ctx.shadowColor = dotColor;
            ctx.shadowBlur = 6;
            ctx.fill();
            ctx.shadowBlur = 0;

            // Message Text
            ctx.fillStyle = "#ffffff";
            ctx.textAlign = "left";
            ctx.fillText(text, bx + 24, by + 19);
        }

        // --- EMPLOYEE ROBOT DATA & AI STATE MACHINE ---
        const employees = [
            { id: 1, name: "Siboru", label: "Siboru - Scanner", color: "#f59e0b", dotColor: "#f59e0b", texts: ["Radar temukan 40 token", "Cek TVL & Volume"], deskGx: 2, deskGy: 6, gx: 2, gy: 6, targetGx: 2, targetGy: 6, state: "WORKING", textIdx: 0, monitorState: 0, waitTimer: 0, facingRight: true, chatPartner: null },
            { id: 2, name: "Raja", label: "Raja - Eksekutor", color: "#ef4444", dotColor: "#f43f5e", texts: ["Beli CBUCKS!", "Take Profit +50%!"], deskGx: 2, deskGy: 4, gx: 2, gy: 4, targetGx: 2, targetGy: 4, state: "WORKING", textIdx: 0, monitorState: 2, waitTimer: 0, facingRight: true, chatPartner: null },
            { id: 3, name: "Parhata", label: "Parhata - Validator", color: "#8b5cf6", dotColor: "#a78bfa", texts: ["Lolos 2 pool.", "Cek Scam & Honeypot"], deskGx: 2, deskGy: 2, gx: 2, gy: 2, targetGx: 2, targetGy: 2, state: "WORKING", textIdx: 0, monitorState: 1, waitTimer: 0, facingRight: true, chatPartner: null },
            { id: 4, name: "Panongani", label: "Panongani - Reporter", color: "#3b82f6", dotColor: "#60a5fa", texts: ["Laporan terkirim", "Update PnL ke Discord"], deskGx: 6, deskGy: 6, gx: 6, gy: 6, targetGx: 6, targetGy: 6, state: "WORKING", textIdx: 0, monitorState: 0, waitTimer: 0, facingRight: false, chatPartner: null },
            { id: 5, name: "Pande", label: "Pande - Web3", color: "#10b981", dotColor: "#34d399", texts: ["Fee $0.86 belum diklaim", "Saldo Devnet 20 SOL"], deskGx: 6, deskGy: 4, gx: 6, gy: 4, targetGx: 6, targetGy: 4, state: "WORKING", textIdx: 0, monitorState: 1, waitTimer: 0, facingRight: false, chatPartner: null },
            { id: 6, name: "Ompu", label: "Ompu - Keamanan", color: "#f97316", dotColor: "#fb923c", texts: ["Validasi Transaksi", "Sanitasi Error OK"], deskGx: 6, deskGy: 2, gx: 6, gy: 2, targetGx: 6, targetGy: 2, state: "WORKING", textIdx: 0, monitorState: 2, waitTimer: 0, facingRight: false, chatPartner: null }
        ];

        // Open Walkable Destinations in Office
        const waypoints = [
            { gx: 4, gy: 4 }, // Center Lounge
            { gx: 4, gy: 2 }, // Top Corridor
            { gx: 4, gy: 6 }, // Bottom Corridor
            { gx: 1, gy: 1 }, // Coffee Break area
            { gx: 7, gy: 7 }, // Plant Corner
            { gx: 4, gy: 7 }  // Main Door Hall
        ];

        let hoveredEmp = null;

        // --- AI AUTONOMOUS ROUTINE UPDATER ---
        function updateRobotAI(emp) {
            if (emp.state === "WORKING") {
                emp.waitTimer++;
                if (emp.waitTimer > 350 + Math.random() * 300) {
                    // Decide to wander or visit break area
                    const dest = waypoints[Math.floor(Math.random() * waypoints.length)];
                    emp.targetGx = dest.gx;
                    emp.targetGy = dest.gy;
                    emp.state = "WALKING";
                    emp.waitTimer = 0;
                }
            } else if (emp.state === "WALKING") {
                const dx = emp.targetGx - emp.gx;
                const dy = emp.targetGy - emp.gy;
                const dist = Math.hypot(dx, dy);

                emp.facingRight = dx > 0;

                if (dist < 0.08) {
                    emp.gx = emp.targetGx;
                    emp.gy = emp.targetGy;
                    emp.state = "PAUSED";
                    emp.waitTimer = 0;
                } else {
                    emp.gx += (dx / dist) * 0.025;
                    emp.gy += (dy / dist) * 0.025;

                    // Check for social chat encounter with nearby walking/paused robots
                    employees.forEach(other => {
                        if (other.id !== emp.id && (other.state === "WALKING" || other.state === "PAUSED")) {
                            const botDist = Math.hypot(other.gx - emp.gx, other.gy - emp.gy);
                            if (botDist < 0.8) {
                                // Initiate Chat Encounter!
                                emp.state = "CHATTING";
                                other.state = "CHATTING";
                                emp.chatPartner = other;
                                other.chatPartner = emp;
                                emp.waitTimer = 0;
                                other.waitTimer = 0;
                                emp.textIdx = (emp.textIdx + 1) % emp.texts.length;
                                other.textIdx = (other.textIdx + 1) % other.texts.length;
                            }
                        }
                    });
                }
            } else if (emp.state === "PAUSED") {
                emp.waitTimer++;
                if (emp.waitTimer > 180) {
                    // Return to Desk
                    emp.targetGx = emp.deskGx;
                    emp.targetGy = emp.deskGy;
                    emp.state = "RETURNING";
                    emp.waitTimer = 0;
                }
            } else if (emp.state === "RETURNING") {
                const dx = emp.targetGx - emp.gx;
                const dy = emp.targetGy - emp.gy;
                const dist = Math.hypot(dx, dy);

                emp.facingRight = dx > 0;

                if (dist < 0.08) {
                    emp.gx = emp.deskGx;
                    emp.gy = emp.deskGy;
                    emp.state = "WORKING";
                    emp.facingRight = emp.deskGx < 4;
                    emp.waitTimer = 0;
                } else {
                    emp.gx += (dx / dist) * 0.025;
                    emp.gy += (dy / dist) * 0.025;
                }
            } else if (emp.state === "CHATTING") {
                emp.waitTimer++;
                if (emp.waitTimer > 240) {
                    // End Chat & continue walking back
                    emp.state = "RETURNING";
                    emp.targetGx = emp.deskGx;
                    emp.targetGy = emp.deskGy;
                    emp.waitTimer = 0;
                    emp.chatPartner = null;
                }
            }
        }

        // --- MAIN RENDER LOOP ---
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const originX = canvas.width / 2;
            const originY = canvas.height / 2 - 80;

            const pTop = gridToScreen(0, 0, originX, originY);
            const pLeft = gridToScreen(0, GRID_ROWS, originX, originY);
            const pRight = gridToScreen(GRID_COLS, 0, originX, originY);
            const wallHeight = 240;

            // 1. ISOMETRIC ROOM WALLS
            ctx.beginPath();
            ctx.moveTo(pTop.x, pTop.y);
            ctx.lineTo(pLeft.x, pLeft.y);
            ctx.lineTo(pLeft.x, pLeft.y - wallHeight);
            ctx.lineTo(pTop.x, pTop.y - wallHeight);
            ctx.closePath();
            ctx.fillStyle = "#16122c";
            ctx.fill();
            ctx.strokeStyle = "rgba(167, 139, 250, 0.15)";
            ctx.lineWidth = 1.5;
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(pTop.x, pTop.y);
            ctx.lineTo(pRight.x, pRight.y);
            ctx.lineTo(pRight.x, pRight.y - wallHeight);
            ctx.lineTo(pTop.x, pTop.y - wallHeight);
            ctx.closePath();
            ctx.fillStyle = "#1d1738";
            ctx.fill();
            ctx.strokeStyle = "rgba(167, 139, 250, 0.15)";
            ctx.stroke();

            // Cyberpunk Wide Window on Wall
            ctx.fillStyle = "rgba(14, 165, 233, 0.08)";
            ctx.fillRect(pTop.x - 160, pTop.y - 170, 100, 100);
            ctx.strokeStyle = "#38bdf8";
            ctx.lineWidth = 1.5;
            ctx.strokeRect(pTop.x - 160, pTop.y - 170, 100, 100);

            // Wall Brand Header
            ctx.fillStyle = "rgba(30, 27, 75, 0.85)";
            ctx.fillRect(pTop.x + 40, pTop.y - 180, 150, 48);
            ctx.strokeStyle = "#a78bfa";
            ctx.strokeRect(pTop.x + 40, pTop.y - 180, 150, 48);
            ctx.font = "800 15px 'Plus Jakarta Sans', sans-serif";
            ctx.fillStyle = "#38bdf8";
            ctx.textAlign = "left";
            ctx.fillText("DJIWA LABS ⚡", pTop.x + 55, pTop.y - 150);

            // 2. ISOMETRIC FLOOR GRID
            for (let r = 0; r < GRID_ROWS; r++) {
                for (let c = 0; c < GRID_COLS; c++) {
                    const pos = gridToScreen(r, c, originX, originY);
                    const isEven = (r + c) % 2 === 0;
                    drawIsoBox(
                        pos.x, pos.y, TILE_WIDTH, 8, TILE_WIDTH, 
                        isEven ? "#241d3d" : "#1e1834", 
                        isEven ? "#19142c" : "#140f24", 
                        isEven ? "#140f24" : "#0f0b1c"
                    );
                }
            }

            // Neon Pathway Accent
            for (let r = 1; r < 8; r++) {
                const carpetPos = gridToScreen(r, 4, originX, originY);
                drawIsoBox(carpetPos.x, carpetPos.y, TILE_WIDTH, 1, TILE_WIDTH * 0.4, "rgba(56, 189, 248, 0.14)", "transparent", "transparent");
            }

            // 3. FIXED OFFICE FURNITURE
            drawServerRack(gridToScreen(0.5, 0.5, originX, originY).x, gridToScreen(0.5, 0.5, originX, originY).y);
            drawCoffeeStation(gridToScreen(0.5, 8.2, originX, originY).x, gridToScreen(0.5, 8.2, originX, originY).y);
            drawPlant(gridToScreen(8.2, 0.5, originX, originY).x, gridToScreen(8.2, 0.5, originX, originY).y);
            drawPlant(gridToScreen(8.2, 8.2, originX, originY).x, gridToScreen(8.2, 8.2, originX, originY).y);

            // Draw Desks at fixed locations
            employees.forEach(emp => {
                const deskPos = gridToScreen(emp.deskGx, emp.deskGy, originX, originY);
                drawDesk(deskPos.x, deskPos.y, emp.state === "WORKING", emp.label, emp.monitorState);
            });

            // 4. UPDATE AI & DRAW ROBOTS
            // Depth sorting for rendering: sort by (gx + gy)
            const sortedEmployees = [...employees].sort((a, b) => (a.gx + a.gy) - (b.gx + b.gy));

            sortedEmployees.forEach(emp => {
                updateRobotAI(emp);

                const pos = gridToScreen(emp.gx, emp.gy, originX, originY);
                const isHovered = (hoveredEmp === emp);
                const isWalking = (emp.state === "WALKING" || emp.state === "RETURNING");

                drawCyborgRobot(pos.x, pos.y, emp.color, isHovered, isWalking, emp.facingRight, emp.state, emp.label);
                drawBubble(pos.x, pos.y, emp.texts[emp.textIdx], isHovered, emp.dotColor, emp.state === "CHATTING");

                emp.renderX = pos.x;
                emp.renderY = pos.y;
            });

            requestAnimationFrame(animate);
        }

        // --- MOUSE & TOUCH INTERACTION ---
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            hoveredEmp = employees.find(emp => {
                const dist = Math.hypot(mouseX - emp.renderX, mouseY - (emp.renderY - 20));
                return dist < 42;
            });

            canvas.style.cursor = hoveredEmp ? 'pointer' : 'default';
        });

        canvas.addEventListener('click', () => {
            if (hoveredEmp) {
                // Cycle employee text message
                hoveredEmp.textIdx = (hoveredEmp.textIdx + 1) % hoveredEmp.texts.length;
                hoveredEmp.monitorState = (hoveredEmp.monitorState + 1) % 3;

                // Force robot to talk / walk if idle
                if (hoveredEmp.state === "WORKING") {
                    const dest = waypoints[Math.floor(Math.random() * waypoints.length)];
                    hoveredEmp.targetGx = dest.gx;
                    hoveredEmp.targetGy = dest.gy;
                    hoveredEmp.state = "WALKING";
                }
            }
        });

        // Start animation frame
        animate();
    </script>
</body>
</html>
