<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DJIWA Labs - Live Office</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0d1117;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
        }
        
        .dashboard {
            width: 100%;
            background-color: #161b22;
            padding: 15px;
            display: flex;
            justify-content: center;
            gap: 20px;
            border-bottom: 2px solid #30363d;
            z-index: 100;
            box-sizing: border-box;
        }
        
        .stat-box { text-align: center; }
        .stat-box span { font-size: 12px; color: #8b949e; }
        .stat-box strong { font-size: 18px; display: block; }
        .profit { color: #3fb950; }
        .loss { color: #f85149; }

        #officeCanvas {
            background-color: #1a1a2e;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.8);
            margin-top: 10px;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <div class="dashboard">
        <div class="stat-box"><span>PnL Total</span><strong id="pnl-total" class="loss">+$18,374</strong></div>
        <div class="stat-box"><span>Posisi</span><strong id="posisi-terbuka">5/5</strong></div>
        <div class="stat-box"><span>Saldo Web3</span><strong id="saldo-devnet" class="profit">20.00 SOL</strong></div>
    </div>

    <canvas id="officeCanvas"></canvas>

    <script>
        const canvas = document.getElementById('officeCanvas');
        const ctx = canvas.getContext('2d');

        // Ukuran Canvas
        canvas.width = window.innerWidth > 1000 ? 1000 : window.innerWidth;
        canvas.height = window.innerHeight - 100;

        // Gambar Lantai & Grid
        function drawFloor() {
            ctx.fillStyle = "#16213e"; // Warna lantai
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.strokeStyle = "rgba(255, 255, 255, 0.05)";
            for(let i=0; i<canvas.width; i+=40) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
            }
            for(let i=0; i<canvas.height; i+=40) {
                ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke();
            }
        }

        // --- DESAIN ROBOT MINI ---
        function drawRobot(x, y, color) {
            // Bayangan
            ctx.beginPath();
            ctx.ellipse(x, y + 15, 12, 5, 0, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(0,0,0,0.5)";
            ctx.fill();

            // Badan Robot
            ctx.beginPath();
            ctx.roundRect(x - 10, y - 5, 20, 20, 5);
            ctx.fillStyle = color;
            ctx.fill();
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 1.5;
            ctx.stroke();

            // Kepala Robot (Helm/Antena)
            ctx.beginPath();
            ctx.arc(x, y - 12, 8, 0, Math.PI * 2);
            ctx.fillStyle = "#e0e0e0"; // Warna logam
            ctx.fill();
            ctx.strokeStyle = "#333";
            ctx.stroke();

            // Mata Robot (Menyala)
            ctx.beginPath();
            ctx.arc(x - 3, y - 13, 2, 0, Math.PI * 2);
            ctx.arc(x + 3, y - 13, 2, 0, Math.PI * 2);
            ctx.fillStyle = "#00ffff"; // Warna mata cyan
            ctx.fill();
        }

        // --- DATA KARYAWAN ---
        const employees = [
            { name: "Siboru", role: "Scanner", x: 200, y: 200, color: "#ff4d4d" },
            { name: "Raja", role: "Eksekutor", x: 200, y: 450, color: "#f1c40f" },
            { name: "Parhata", role: "Validator", x: 800, y: 200, color: "#3498db" },
            { name: "Panongani", role: "Reporter", x: 800, y: 450, color: "#9b59b6" },
            { name: "Pande", role: "Web3", x: 500, y: 150, color: "#2ecc71" },
            { name: "Ompu", role: "Keamanan", x: 500, y: 500, color: "#e67e22" }
        ];

        // Tambahkan properti gerak (cx, cy, target, dll)
        employees.forEach(emp => {
            emp.cx = emp.x; 
            emp.cy = emp.y;
            emp.baseX = emp.x; // Titik awal (meja)
            emp.baseY = emp.y;
            emp.timeOffset = Math.random() * 100; // Agar gerakan tidak seragam
        });

        // Gambar Meja & Nama
        function drawDesks() {
            employees.forEach(emp => {
                // Meja
                ctx.fillStyle = "#2c3e50";
                ctx.fillRect(emp.baseX - 25, emp.baseY - 5, 50, 30);
                ctx.strokeStyle = "#58a6ff";
                ctx.strokeRect(emp.baseX - 25, emp.baseY - 5, 50, 30);

                // Layar Monitor
                ctx.fillStyle = "#00ffff";
                ctx.fillRect(emp.baseX - 15, emp.baseY, 30, 15);

                // Nama
                ctx.fillStyle = "white";
                ctx.font = "bold 12px Arial";
                ctx.textAlign = "center";
                ctx.fillText(emp.name, emp.baseX, emp.baseY + 45);
            });
        }

        // --- LOGIKA ANIMASI ---
        let tick = 0;
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawFloor();
            drawDesks();

            tick += 0.05; // Kecepatan gerak global

            employees.forEach(emp => {
                // Logika agar robot bergerak mondar-mandir (menggunakan fungsi Sin/Cos)
                // Setiap robot punya ritme sendiri berdasarkan timeOffset
                const movementRange = 15; 
                const offsetX = Math.sin(tick + emp.timeOffset) * movementRange;
                const offsetY = Math.cos(tick + emp.timeOffset) * (movementRange / 2);

                // Posisi saat ini
                emp.cx = emp.baseX + offsetX;
                emp.cy = emp.baseY + offsetY;

                drawRobot(emp.cx, emp.cy, emp.color);
            });

            requestAnimationFrame(animate);
        }

        // Mulai animasi
        animate();
    </script>
</body>
</html>
